<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>지수학 스터디</title>
<link href="./index_files/css2" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0f5ff;--bg2:#ffffff;--bg3:#f5f8ff;--bg4:#eaeffc;
  --border:#d4defd;--border2:#b8c9f8;
  --text:#0d1b3e;--text2:#3a5280;--text3:#7a90b8;
  --blue:#1e40af;--blue2:#2563eb;--blue3:#3b82f6;--blue-l:#dbeafe;
  --green:#047857;--green2:#059669;--green3:#10b981;--green-l:#d1fae5;
  --amber:#b45309;--amber2:#d97706;--amber-l:#fef3c7;
  --red:#b91c1c;--red2:#dc2626;--red-l:#fee2e2;
  --r:14px;--r2:10px;--r3:7px;
  --shadow:0 2px 12px rgba(30,64,175,.1);
  --shadow2:0 4px 24px rgba(30,64,175,.15);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.scr{display:none}.scr.on{display:block}

/* ── 버튼 ── */
.btn{border:none;border-radius:var(--r2);padding:10px 16px;font:600 13px/1 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn-blue{background:var(--blue2);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}.btn-blue:active{opacity:.85}
.btn-ghost{background:var(--bg3);border:1px solid var(--border2);color:var(--text2)}.btn-ghost:active{background:var(--bg4)}
.btn-green{background:var(--green2);color:#fff}.btn-green:active{opacity:.85}
.btn-red{background:var(--red-l);border:1px solid rgba(220,38,38,.3);color:var(--red2)}
.btn-sm{padding:6px 12px;font-size:11px}.btn-full{width:100%}

/* ── 입력 ── */
.inp{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:11px 13px;color:var(--text);font:14px 'Noto Sans KR',sans-serif;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}.inp::placeholder{color:var(--text3)}
.ta{resize:vertical;min-height:70px;line-height:1.7}

/* ════ HOME ════ */
#scrHome{background:linear-gradient(160deg,#1e3a8a 0%,#2563eb 40%,#f0f5ff 60%)}
.home-inner{max-width:500px;margin:0 auto;padding:44px 18px 60px}
.home-top{margin-bottom:36px;text-align:center}
.home-logo{width:72px;height:72px;object-fit:contain;filter:brightness(0) invert(1);margin-bottom:12px}
.home-logo-t .n1{font-size:30px;font-weight:900;color:#fff;letter-spacing:-1px}
.home-logo-t .n2{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:3px;margin-top:2px}
.home-card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow2);overflow:hidden;margin-bottom:12px}
.home-admin-btn{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .2s;background:#fff;border:none;width:100%;text-align:left}
.home-admin-btn:active{background:var(--bg3)}
.home-admin-btn .t{font-size:15px;font-weight:700;color:var(--text)}
.home-admin-btn .s{font-size:11px;color:var(--text3);margin-top:3px}
.home-admin-btn .ar{font-size:22px;color:var(--blue3)}
.home-sec{font-size:10px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;padding:0 2px}
.stu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stu-btn{background:#fff;border-radius:var(--r2);padding:14px 12px;cursor:pointer;text-align:center;transition:all .18s;position:relative;box-shadow:0 2px 8px rgba(30,64,175,.08)}
.stu-btn:active{transform:scale(.97);box-shadow:none}
.stu-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--border);margin:0 auto 8px;transition:.2s}
.stu-btn.done .dot{background:var(--green3);box-shadow:0 0 8px rgba(16,185,129,.4)}
.stu-btn .nm{font-size:14px;font-weight:700;color:var(--text)}
.stu-btn .gr{font-size:10px;color:var(--text3);margin-top:2px}
.stu-btn .qbadge{position:absolute;top:7px;right:9px;background:var(--red2);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px}

/* ════ PIN ════ */
.overlay{position:fixed;inset:0;background:rgba(14,30,80,.7);z-index:900;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}.overlay.on{display:flex}
.pin-box{background:#fff;border-radius:var(--r);padding:28px 22px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.pin-box .pt{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.pin-box .ps{font-size:12px;color:var(--text3);margin-bottom:20px;line-height:1.5}
.pin-btns{display:flex;gap:8px;margin-top:14px}.pin-btns .btn{flex:1}
.errmsg{font-size:11px;color:var(--red2);margin-top:5px;min-height:15px}

/* ════ HEADER ════ */
.app-hd{background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(30,64,175,.08)}
.hd-back{background:none;border:none;color:var(--blue2);font-size:22px;cursor:pointer;padding:0 6px 0 0;line-height:1;flex-shrink:0}
.hd-logo{width:28px;height:28px;object-fit:contain;flex-shrink:0}
.hd-info{flex:1;min-width:0}
.hd-title{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-sub{font-size:9px;color:var(--text3)}
.hd-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--green3);opacity:0;transition:opacity .3s}.sdot.on{opacity:1}

/* ════ TABS ════ */
.tab-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 12px;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:0}
.tab{padding:10px 12px;border:none;background:transparent;color:var(--text3);font:500 11px 'Noto Sans KR',sans-serif;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;flex-shrink:0}
.tab.on{color:var(--blue2);border-bottom-color:var(--blue2);font-weight:700}

/* ════ DATE BAR ════ */
.date-bar{background:var(--bg3);border-bottom:1px solid var(--border);padding:6px 10px;display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.dbt{padding:4px 9px;border-radius:var(--r3);border:1px solid var(--border);background:#fff;color:var(--text3);font:11px 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;flex-shrink:0;white-space:nowrap}
.dbt.on{background:var(--blue2);border-color:var(--blue2);color:#fff;font-weight:700}.dbt.td{border-color:var(--blue2);color:var(--blue2)}

/* ════ CONTENT ════ */
.ct{padding:12px 13px 80px}

/* ── 카드 ── */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-hd{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}

/* ── 날짜 요약 카드 ── */
.day-card{background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);border-radius:var(--r);padding:16px;margin-bottom:10px;color:#fff;box-shadow:0 4px 16px rgba(37,99,235,.3)}
.day-card .dt{font-size:16px;font-weight:800}
.day-card .ds{font-size:11px;opacity:.8;margin-top:3px}
.day-progbar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;margin-top:10px}
.day-progfill{height:100%;border-radius:3px;background:#fff;transition:width .5s}

/* ── 학생 행 ── */
.srow{background:#fff;border:1px solid var(--border);border-radius:var(--r2);padding:12px 13px;margin-bottom:8px;box-shadow:0 1px 4px rgba(30,64,175,.06)}
.srow-hd{display:flex;align-items:center;gap:9px;margin-bottom:10px;cursor:pointer}
.chk{width:20px;height:20px;border-radius:5px;border:2px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;flex-shrink:0}
.chk.on{background:var(--green2);border-color:var(--green2);color:#fff}
.snm{font-size:14px;font-weight:700;flex:1;color:var(--text)}
.sgr{font-size:10px;color:var(--text3)}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.b-done{background:var(--green-l);color:var(--green2);border:1px solid var(--green3)}
.b-wip{background:var(--amber-l);color:var(--amber2);border:1px solid var(--amber2)}
.b-none{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.chip{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--bg4);color:var(--text3);border:1px solid var(--border)}

/* ── 요약바 ── */
.sumbar{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px}
.si{background:#fff;border:1px solid var(--border);border-radius:var(--r2);padding:9px 13px;flex-shrink:0;text-align:center;min-width:64px;box-shadow:0 1px 4px rgba(30,64,175,.06)}
.sv{font-size:20px;font-weight:800;line-height:1}.sl{font-size:9px;color:var(--text3);margin-top:3px}
.cb{color:var(--blue2)}.cg{color:var(--green2)}.ca{color:var(--amber2)}.cc{color:#0891b2}.cr{color:var(--red2)}

/* ── 통계 ── */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.sg3{grid-template-columns:repeat(3,1fr)}
.sbox{background:#fff;border:1px solid var(--border);border-radius:var(--r2);padding:12px;box-shadow:0 1px 4px rgba(30,64,175,.06)}
.sbl{font-size:9px;color:var(--text3);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.sbv{font-size:22px;font-weight:800;line-height:1;color:var(--text)}.sbv .u{font-size:10px;font-weight:400;color:var(--text3);margin-left:2px}

/* ── 번호별 체크리스트 ── */
.tasklist{margin:0 0 14px}
.ti{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r3);margin-bottom:6px;border:1px solid var(--border);background:var(--bg3);transition:all .2s}
.ti.s-done{background:var(--green-l);border-color:var(--green3)}
.ti.s-wip{background:var(--amber-l);border-color:var(--amber2)}
.ti-num{font-size:13px;font-weight:800;color:var(--blue2);flex-shrink:0;width:22px;margin-top:2px}
.ti.s-done .ti-num{color:var(--green2)}.ti.s-wip .ti-num{color:var(--amber2)}
.ti-text{font-size:13px;line-height:1.6;flex:1;color:var(--text);transition:all .2s}
.ti.s-done .ti-text{text-decoration:line-through;color:var(--text3)}
.ti-status{flex-shrink:0}
.status-btn{border:none;border-radius:20px;padding:3px 10px;font:600 10px 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .2s;white-space:nowrap}
.sb-none{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.sb-wip{background:var(--amber-l);color:var(--amber2);border:1px solid var(--amber2)}
.sb-done{background:var(--green-l);color:var(--green2);border:1px solid var(--green3)}

/* ── 공부시간 ── */
.study-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.study-hd{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px}
.study-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.slbl{font-size:12px;color:var(--text2);width:80px;flex-shrink:0;font-weight:600}
.sinp{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r3);padding:9px 10px;color:var(--text);font:700 16px 'Noto Sans KR',sans-serif;outline:none;width:90px;text-align:center}
.sinp:focus{border-color:var(--blue2)}
.sunit{font-size:12px;color:var(--text3)}
.goal-bar{height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;margin-top:4px;border:1px solid var(--border)}
.goal-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue2),var(--blue3));transition:width .5s}
.goal-text{font-size:10px;color:var(--text3);margin-top:4px;text-align:right}

/* ── 마감일 ── */
.dl-wrap{background:var(--bg4);border-radius:var(--r3);padding:10px 12px;margin-top:8px;border:1px solid var(--border)}
.dl-t{font-size:10px;color:var(--text3);font-weight:600;margin-bottom:8px}
.dl-opts{display:flex;gap:16px;align-items:center}
.dl-opt{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:var(--text2);font-weight:500}
.dl-opt input[type=radio]{accent-color:var(--blue2)}
.dl-date-inp{background:#fff;border:1px solid var(--border2);border-radius:var(--r3);padding:7px 10px;color:var(--text);font:12px 'Noto Sans KR',sans-serif;outline:none;margin-top:8px;width:100%}
.dl-badge{display:inline-flex;align-items:center;font-size:10px;padding:2px 9px;border-radius:20px;font-weight:700}
.dl-today{background:var(--red-l);color:var(--red2);border:1px solid rgba(220,38,38,.3)}
.dl-date{background:var(--amber-l);color:var(--amber2);border:1px solid rgba(217,119,6,.3)}

/* ── 자기평가 (완료하기 대체) ── */
.selfeval{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.selfeval-hd{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px}
.star-row{display:flex;gap:6px;margin-bottom:10px}
.star{font-size:26px;cursor:pointer;transition:transform .1s;filter:grayscale(1);opacity:.4}
.star.on{filter:none;opacity:1;transform:scale(1.1)}
.mood-row{display:flex;gap:8px;flex-wrap:wrap}
.mood-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);font:600 12px 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;color:var(--text2)}
.mood-btn.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}

/* ── 오늘 지침 카드 ── */
.task-card{background:linear-gradient(135deg,rgba(37,99,235,.06),rgba(30,64,175,.03));border:1px solid rgba(37,99,235,.2);border-radius:var(--r);padding:16px;margin-bottom:10px}
.task-lbl{font-size:9px;color:var(--blue2);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.task-empty{font-size:13px;color:var(--text3);text-align:center;padding:14px 0}
.task-meta{font-size:10px;color:var(--text3);margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}

/* ── 달력 ── */
.cal-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.cal-nav-t{font-size:14px;font-weight:700;color:var(--text)}
.cal-nav-b{display:flex;gap:5px;flex-wrap:wrap}
.mnbtn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r3);padding:5px 11px;color:var(--text2);font:600 11px 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s}
.mnbtn.on{background:var(--blue2);border-color:var(--blue2);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-hd{font-size:9px;color:var(--text3);text-align:center;padding:3px 0;font-weight:600}
.cal-hd.sun{color:var(--red2)}.cal-hd.sat{color:var(--blue2)}
.cal-day{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:3px;min-height:38px;cursor:pointer;transition:all .15s}
.cal-day.td{border-color:var(--blue2);background:var(--blue-l)}.cal-day.fut{opacity:.35;cursor:default}
.cal-day .dn{font-size:9px;font-weight:600;text-align:center;color:var(--text)}
.cal-day.sun .dn{color:var(--red2)}.cal-day.sat .dn{color:var(--blue2)}
.cal-day .dh{font-size:8px;color:var(--blue2);text-align:center}
.cdot{width:4px;height:4px;border-radius:50%;margin:2px auto}
.cd-ok{background:var(--green2)}.cd-no{background:var(--border2)}

/* ── 통계 차트 ── */
.wchart{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.wct{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px}
.wbars{display:flex;align-items:flex-end;gap:5px;height:72px}
.wbw{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.wb{width:100%;border-radius:3px 3px 0 0;min-height:3px;transition:height .5s}
.wb-t{background:linear-gradient(180deg,var(--blue2),var(--blue3))}.wb-p{background:rgba(37,99,235,.25)}
.wl{font-size:8px;color:var(--text3);text-align:center}.wv{font-size:8px;color:var(--text3);text-align:center}
.rchart{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.rct{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px}
.rrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rnm{font-size:11px;color:var(--text2);width:52px;text-align:right;flex-shrink:0}
.rtk{flex:1;height:18px;background:var(--bg4);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.rfl{height:100%;border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;font-size:8px;font-weight:700;color:#fff;min-width:3px;transition:width .6s}
.rme{background:linear-gradient(90deg,var(--blue),var(--blue3))}.rot{background:linear-gradient(90deg,rgba(37,99,235,.4),rgba(59,130,246,.6))}
.rrk{font-size:10px;color:var(--text3);width:18px;text-align:center}

/* ── Q&A ── */
.qa-thread{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.qa-msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;position:relative}
.qa-msg.stu{background:var(--blue-l);color:var(--blue);border-bottom-left-radius:4px;align-self:flex-start;border:1px solid rgba(37,99,235,.2)}
.qa-msg.teacher{background:var(--green-l);color:var(--green);border-bottom-right-radius:4px;align-self:flex-end;border:1px solid rgba(16,185,129,.3)}
.qa-msg-meta{font-size:9px;opacity:.6;margin-top:4px}
.qa-pending{font-size:11px;color:var(--text3);font-style:italic;padding:6px 0}
.qa-input-area{background:var(--bg3);border-top:1px solid var(--border);padding:12px;position:sticky;bottom:0}
.qa-input-row{display:flex;gap:8px}
.qa-student-list .qsi{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:all .15s}
.qa-student-list .qsi:hover{background:var(--bg3)}
.qa-student-list .qsi:last-child{border-bottom:none}
.qbadge-lg{background:var(--red2);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}

/* ── 비교 ── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:var(--r2);padding:12px 13px;margin-bottom:10px;box-shadow:var(--shadow)}
.tg-info .tl{font-size:12px;font-weight:600;color:var(--text)}.tg-info .ts{font-size:10px;color:var(--text3);margin-top:2px}
.sw{position:relative;width:44px;height:25px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .sl{position:absolute;inset:0;background:var(--bg4);border:1px solid var(--border2);border-radius:20px;cursor:pointer;transition:.25s}
.sw .sl::before{content:'';position:absolute;width:19px;height:19px;left:2px;top:2px;background:var(--text3);border-radius:50%;transition:.25s}
.sw input:checked+.sl{background:rgba(5,150,105,.15);border-color:var(--green2)}
.sw input:checked+.sl::before{transform:translateX(19px);background:var(--green2)}
.ctable{width:100%;border-collapse:collapse}
.ctable th{font-size:10px;color:var(--text3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-weight:600}
.ctable td{font-size:12px;padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.rnk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700}
.r1{background:rgba(245,158,11,.15);color:var(--amber2)}.r2{background:rgba(148,163,184,.15);color:#64748b}
.r3{background:rgba(180,83,9,.12);color:#92400e}.rn{background:var(--bg4);color:var(--text3)}

/* ── 메모/피드백 ── */
.fb-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.fb-t{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:10px}
.fb-item{background:var(--bg3);border-radius:var(--r3);padding:10px;margin-bottom:6px;font-size:12px;line-height:1.6;color:var(--text);border:1px solid var(--border)}
.fb-m{font-size:10px;color:var(--text3);margin-top:3px}
.memo-ta{width:100%;min-height:100px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r3);padding:10px;color:var(--text);font:12px/1.7 'Noto Sans KR',sans-serif;resize:vertical;outline:none}.memo-ta:focus{border-color:var(--blue2)}

/* ── 기타 ── */
.divlbl{font-size:9px;color:var(--text3);font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 0 4px;border-bottom:1px solid var(--border);margin-bottom:10px}
.fab{position:fixed;bottom:20px;right:16px;width:42px;height:42px;border-radius:50%;background:var(--blue2);border:none;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 16px rgba(37,99,235,.3);z-index:80;display:none;align-items:center;justify-content:center}.fab.on{display:flex}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}.empty .ei{font-size:28px;margin-bottom:10px}
.set-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}.set-row:last-child{border-bottom:none}
.nqbadge{display:inline-flex;align-items:center;justify-content:center;background:var(--red2);color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 5px;margin-left:3px;vertical-align:middle}
.auto-num-hint{font-size:10px;color:var(--text3);margin-top:4px}
@media(max-width:380px){.stu-grid{grid-template-columns:1fr 1fr}.sg3{grid-template-columns:1fr 1fr}}
</style>
</head>

// ── 데이터 ──
function load(){
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB);
    fbRef=firebase.database().ref("jibak_v4");
    fbRef.on("value",snap=>{
      DB=snap.val()||{};
      if(!fbInited){fbInited=true;buildHomeGrid();updateQaBadge();}
      else{buildHomeGrid();updateQaBadge();refreshCurrentView();}
    });
  }catch(e){
    try{DB=JSON.parse(localStorage.getItem(KEY)||"{}");}catch{DB={};}
    buildHomeGrid();
  }
}
function save(){
  if(fbRef)fbRef.set(DB);
  try{localStorage.setItem(KEY,JSON.stringify(DB));}catch{}
  ['saveDot','saveDotStu'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1400);
  });
}
function ep(...keys){let o=DB;for(const k of keys){if(!o[k])o[k]={};o=o[k];}return o;}
function todayKey(){return "d"+String(TODAY.d).padStart(2,"0");}
function getMonthCfg(key){return MONTHS.find(x=>x.key===key)||MONTHS[0];}
function curMonthKey(){const f=MONTHS.find(x=>x.m===TODAY.m&&x.y===TODAY.y);return f?f.key:MONTHS[0].key;}
function defStu(){return {done:false,task:"",hours:0,note:"",itemStatus:{},stars:0,mood:"",selfNote:""};}
function getDayData(mk,dk){
  const d=ep(mk,dk);
  if(!d.students)d.students={};
  STUDENTS.forEach(s=>{if(!d.students[s.name])d.students[s.name]=defStu();});
  return d;
}
function getStuData(mk,dk,name){
  const d=getDayData(mk,dk);
  if(!d.students[name])d.students[name]=defStu();
  return d.students[name];
}
// textarea 값 수집
function collectTaValues(){
  const vals={};
  document.querySelectorAll('textarea[id]').forEach(ta=>{vals[ta.id]=ta.value;});
  return vals;
}
// textarea 값 복원
function restoreTaValues(vals){
  Object.entries(vals).forEach(([id,val])=>{
    const el=document.getElementById(id);
    if(el&&el.tagName==='TEXTAREA') el.value=val;
  });
}
function refreshCurrentView(){
  const sy=window.scrollY;
  const taVals=collectTaValues(); // 현재 입력값 저장
  if(document.getElementById('scrAdmin').classList.contains('on'))renderAdmin();
  if(document.getElementById('scrStudent').classList.contains('on'))renderStudent();
  requestAnimationFrame(()=>{
    window.scrollTo(0,sy);
    restoreTaValues(taVals); // 입력값 복원
  });
}

// ── 번호 파싱 ──
function parseItems(text){
  if(!text)return[];
  return text.split('\n').map(l=>l.match(/^\s*(\d+)[.)\s]\s*(.+)/)).filter(Boolean).map(m=>{return{num:parseInt(m[1]),text:m[2].trim()}});
}

// ── 자동 번호 입력 ──
function autoNumKeydown(e){
  const ta=e.target;
  if(e.key==='Enter'){
    e.preventDefault();
    const val=ta.value,pos=ta.selectionStart;
    const before=val.substring(0,pos);
    const lines=before.split('\n');
    const last=lines[lines.length-1];
    const m=last.match(/^(\d+)[.)]/);
    if(m){
      const next=parseInt(m[1])+1;
      const ins='\n'+next+'. ';
      ta.value=before+ins+val.substring(pos);
      const np=pos+ins.length;
      ta.setSelectionRange(np,np);
    }else{
      const ins='\n';
      ta.value=before+ins+val.substring(pos);
      const np=pos+ins.length;
      ta.setSelectionRange(np,np);
    }
  }
  if(e.key==='Tab'){e.preventDefault();
    if(!ta.value.trim()){ta.value='1. ';ta.setSelectionRange(3,3);}
  }
}
function initAutoNum(ta){
  if(!ta.value.trim()){ta.value='1. ';ta.setSelectionRange(3,3);}
}

// ── Q&A ──
function getQAs(name){
  const q=ep('questions',name);
  return Object.entries(q).sort((a,b)=>a[0].localeCompare(b[0]));
}
function countNewQs(){
  let cnt=0;
  STUDENTS.forEach(s=>{
    const q=ep('questions',s.name);
    Object.values(q).forEach(v=>{if(!v.answered)cnt++;});
  });
  return cnt;
}
function updateQaBadge(){
  const n=countNewQs();
  const b=document.getElementById('adminQaBadge');
  if(b){b.style.display=n>0?'inline-flex':'none';b.textContent=n;}
}

// ── 통계 ──
function calcStats(name){
  const st={totalHours:0,doneDays:0,streak:0,weekHours:Array(7).fill(0),monthMap:{}};
  MONTHS.forEach(mc=>{
    const md=DB[mc.key];if(!md)return;
    for(let d=1;d<=mc.days;d++){
      const dk="d"+String(d).padStart(2,"0");
      const day=md[dk];if(!day||!day.students||!day.students[name])continue;
      const sd=day.students[name];
      const h=parseFloat(sd.hours||sd.studyHours||0)||0;
      st.totalHours+=h;
      if(sd.done)st.doneDays++;
      const dkey=`${mc.y}-${String(mc.m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      st.monthMap[dkey]={h,done:sd.done};
    }
  });
  for(let i=0;i<7;i++){
    const dt=new Date(_now);dt.setDate(dt.getDate()-i);
    const dk=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
    st.weekHours[6-i]=(st.monthMap[dk]||{}).h||0;
  }
  for(let i=0;i<60;i++){
    const dt=new Date(_now);dt.setDate(dt.getDate()-i);
    const dk=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
    if((st.monthMap[dk]||{}).done)st.streak++;else break;
  }
  const tf=`${TODAY.y}-${String(TODAY.m).padStart(2,"0")}-${String(TODAY.d).padStart(2,"0")}`;
  const yf=(()=>{const dt=new Date(_now);dt.setDate(dt.getDate()-1);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
  })();
  const lf=(()=>{const dt=new Date(_now);dt.setDate(dt.getDate()-7);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
  })();
  st.todayH=(st.monthMap[tf]||{}).h||0;
  st.yesterH=(st.monthMap[yf]||{}).h||0;
  st.lwH=(st.monthMap[lf]||{}).h||0;
  return st;
}
function getTodayRank(){
  const mk=MONTHS.find(x=>x.m===TODAY.m&&x.y===TODAY.y);if(!mk)return[];
  const dk=todayKey();
  return STUDENTS.map(s=>{
    const sd=getStuData(mk.key,dk,s.name);
    return {name:s.name,hours:parseFloat(sd.hours||sd.studyHours||0)||0,done:sd.done};
  }).sort((a,b)=>b.hours-a.hours);
}
function isCompareOn(){return !!(DB.settings&&DB.settings.compareOpen);}
function getTargetHours(){return parseFloat((DB.settings||{}).targetHours||2);}

function showScr(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0);}

function buildHomeGrid(){
  const mk=MONTHS.find(x=>x.m===TODAY.m&&x.y===TODAY.y);

  document.getElementById('homeGrid').innerHTML=STUDENTS.map(s=>{

}

// ── PIN ──
let _mode='',_pname='';
function openPin(mode,name=''){
  _mode=mode;_pname=name;
  if(mode==='admin'){document.getElementById('pinTitle').textContent='🔐 관리자 로그인';document.getElementById('pinSub').textContent='선생님 PIN을 입력하세요';}
  else{document.getElementById('pinTitle').textContent=`🙋 ${name}`;document.getElementById('pinSub').innerHTML='개인 PIN 입력<br><span style="font-size:10px;color:var(--text3)">처음이면 새 PIN으로 등록됩니다</span>';}
  document.getElementById('pinInp').value='';document.getElementById('pinErr').textContent='';
  document.getElementById('pinOverlay').classList.add('on');
  setTimeout(()=>document.getElementById('pinInp').focus(),150);
}
function closePin(){document.getElementById('pinOverlay').classList.remove('on');}
function confirmPin(){
  const v=document.getElementById('pinInp').value;
  const e=document.getElementById('pinErr');
  if(!v||v.length<2){e.textContent='PIN을 입력하세요';return;}
  if(_mode==='admin'){
    if(v===ADMIN_PIN){closePin();openAdmin();}
    else{e.textContent='PIN이 틀렸습니다';document.getElementById('pinInp').value='';}
  }else{
    const stored=(DB.pins||{})[_pname];
    if(!stored){ep('pins')[_pname]=v;save();closePin();openStudent(_pname);}
    else if(stored===v){closePin();openStudent(_pname);}
    else{e.textContent='PIN이 틀렸습니다';document.getElementById('pinInp').value='';}
  }
}

// ── ADMIN ──
function openAdmin(){
  curAdminMk=curMonthKey();curAdminDk=todayKey();adminView='daily';
  buildAdminMonthBtns();
  document.querySelectorAll('#scrAdmin .tab').forEach((t,i)=>t.classList.toggle('on',i===0));
  showScr('scrAdmin');renderAdmin();
}
function buildAdminMonthBtns(){
  const cur=MONTHS.findIndex(x=>x.key===curAdminMk);
  const show=MONTHS.slice(Math.max(0,cur-1),cur+3);
  document.getElementById('adminMonthBtns').innerHTML=show.map(mc=>
    `<button class="mnbtn ${mc.key===curAdminMk?'on':''}" onclick="curAdminMk='${mc.key}';curAdminDk=todayKey();buildAdminMonthBtns();renderAdmin()">${mc.label}</button>`
  ).join('');
}
function aTab(v,el){
  adminView=v;adminQaStudent=null;
  document.querySelectorAll('#scrAdmin .tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');renderAdmin();
}
function renderAdmin(){
  const db=document.getElementById('adminDateBar');
  if(adminView==='daily'){db.style.display='flex';buildAdminDateBar(getMonthCfg(curAdminMk));}
  else db.style.display='none';
  const ct=document.getElementById('adminCt');
  const mc=getMonthCfg(curAdminMk);
  if(adminView==='daily')renderAdminDaily(ct,mc);
  else if(adminView==='monthly')renderAdminMonthly(ct,mc);
  else if(adminView==='stats')renderAdminStats(ct);
  else if(adminView==='compare')renderAdminCompare(ct);
  else if(adminView==='qa')renderAdminQa(ct);
  else if(adminView==='settings')renderAdminSettings(ct);
}
function buildAdminDateBar(mc){
  let h=`<button class="dbt td" onclick="curAdminDk=todayKey();renderAdmin()">📍오늘</button>`;
  for(let d=1;d<=mc.days;d++){
    const dt=new Date(mc.y,mc.m-1,d);const dow=DK[dt.getDay()];
    const dk="d"+String(d).padStart(2,"0");
    const isToday=mc.m===TODAY.m&&mc.y===TODAY.y&&d===TODAY.d;
    h+=`<button class="dbt ${curAdminDk===dk?'on':''} ${isToday&&curAdminDk!==dk?'td':''}"
      style="${dow==='일'&&curAdminDk!==dk?'color:var(--red2)':''}"
      onclick="curAdminDk='${dk}';renderAdmin()">${d}(${dow})${isToday?' ◀':''}</button>`;
  }
  document.getElementById('adminDateBar').innerHTML=h;
  setTimeout(()=>{const a=document.querySelector('.dbt.on');if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});},80);
}

  const inp=document.getElementById('dlDateInp');
  if(inp)inp.style.display=t&&t.value==='date'?'block':'none';
}
function updateDlUIStu(name){
  const id=name.replace(/ /g,'_');
  const t=document.querySelector(`input[name="dl_type_${id}"]:checked`);
  const inp=document.getElementById('dl_date_'+id);
  if(inp)inp.style.display=t&&t.value==='date'?'block':'none';
}
function saveCommonTask(mk,dk){
  const val=document.getElementById('commonTa').value;
  const dlType=(document.querySelector('input[name=dlType]:checked')||{}).value||'today';
  const dlDate=document.getElementById('dlDateInp')?document.getElementById('dlDateInp').value:'';
  const d=ep(mk,dk);d.commonTask=val;d.deadlineType=dlType;d.deadlineDate=dlDate;
  const taVals=collectTaValues();
  save();
  restoreTaValues(taVals);
  const btn=event.target;btn.textContent='저장됨 ✓';btn.style.background='var(--green2)';
  setTimeout(()=>{btn.textContent='저장하기';btn.style.background='';},1500);
}
function saveStuTask(mk,dk,name){
  const id='task_'+name.replace(/ /g,'_');
  const val=document.getElementById(id)?document.getElementById(id).value:'';
  getStuData(mk,dk,name).task=val;
  // 개인 마감일도 함께 저장
  const dlId='dl_type_'+name.replace(/ /g,'_');
  const dlDateId='dl_date_'+name.replace(/ /g,'_');
  const dlRadio=document.querySelector(`input[name="${dlId}"]:checked`);
  const dlDateEl=document.getElementById(dlDateId);
  if(dlRadio){
    getStuData(mk,dk,name).deadlineType=dlRadio.value;
    getStuData(mk,dk,name).deadlineDate=dlDateEl?dlDateEl.value:'';
  }
  // 다른 학생 입력값도 모두 임시 저장
  const taVals=collectTaValues();
  save();
  restoreTaValues(taVals);
  const btn=event.target;btn.textContent='저장됨 ✓';btn.style.background='var(--green2)';
  setTimeout(()=>{btn.textContent='저장';btn.style.background='';},1500);
}

function backupData(){

function restoreData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{try{DB=JSON.parse(ev.target.result);save();alert('복원 완료!');renderAdmin();}catch{alert('파일 오류');}};
  r.readAsText(file,'UTF-8');e.target.value='';

function cycleStatus(idx){
  const mc=getMonthCfg(curStuMk);
  const sd=getStuData(mc.key,todayKey(),curStudent);
  if(!sd.itemStatus)sd.itemStatus={};
  const cur=sd.itemStatus[idx]||'none';
  sd.itemStatus[idx]=cur==='none'?'wip':cur==='wip'?'done':'none';
  // 모든 항목 완료시 done 표시
  const day=getDayData(mc.key,todayKey());
  const items=parseItems(sd.task||day.commonTask||'');
  if(items.length>0&&items.every((_,i)=>sd.itemStatus[i]==='done'))sd.done=true;
  else sd.done=false;
  save();
  const sy=window.scrollY;renderStudent();buildHomeGrid();
  requestAnimationFrame(()=>window.scrollTo(0,sy));
}

  </div>
  <div class="qa-thread" style="margin:12px 0 80px">`;
  if(!qas.length){h+=`<div class="empty"><div class="ei">💬</div>아직 질문이 없어요<br><span style="font-size:11px">아래에서 질문을 보내보세요</span></div>`;}
  qas.forEach(([k,v])=>{
    h+=`<div class="qa-msg stu">
      ${v.text}
      <div class="qa-msg-meta">${new Date(parseInt(k)).toLocaleString('ko-KR')}</div>
    </div>`;
    if(v.answered){
      h+=`<div class="qa-msg teacher">
        ${v.answer}
        <div class="qa-msg-meta">선생님 답변</div>
      </div>`;
    }else{
      h+=`<div class="qa-pending">⏳ 선생님이 확인 중이에요...</div>`;
    }
  });
  h+=`</div>
  <div class="qa-input-area">
    <div style="font-size:10px;color:var(--text3);margin-bottom:6px">질문할 내용을 구체적으로 적어주세요 (문제번호, 막힌 부분 등)</div>
    <div class="qa-input-row">
      <textarea class="inp" id="qaInput" placeholder="예) 수학의 정석 p.45 예제3번 2번째 줄에서 막혔어요..." style="flex:1;min-height:60px;font-size:13px;resize:none"></textarea>
      <button class="btn btn-blue" style="height:60px;padding:0 14px;flex-shrink:0" onclick="sendQuestion()">전송</button>
    </div>
  </div>`;ct.innerHTML=h;
  // 스크롤
  setTimeout(()=>{const t=ct.querySelector('.qa-thread');if(t)t.scrollIntoView({block:'end'});},100);
}
function sendQuestion(){
  const val=(document.getElementById('qaInput')||{}).value;
  if(!val||!val.trim())return;
  const key=Date.now().toString();
  ep('questions',curStudent,key).text=val.trim();
  ep('questions',curStudent,key).answered=false;
  ep('questions',curStudent,key).time=key;
  save();
  document.getElementById('qaInput').value='';
  renderStudent();
}
function renderStuMemo(ct){
  const memos=ep('memos',curStudent);
  const feedbacks=Object.entries(ep('feedback',curStudent)).sort((a,b)=>b[0].localeCompare(a[0]));
  const tk=`${TODAY.y}_${String(TODAY.m).padStart(2,"00")}_${String(TODAY.d).padStart(2,"00")}`;
  const memo=(memos[tk]||{}).text||'';
  let h=`<div class="card"><div class="card-hd">📝 오늘의 학습 메모</div>
    <textarea class="memo-ta" id="memoTa" placeholder="오늘 공부한 것, 막힌 내용, 느낀 점...">${memo}</textarea>
    <div style="display:flex;justify-content:flex-end;margin-top:8px">
      <button class="btn btn-blue btn-sm" id="saveMemoBtn" onclick="saveMemo('${tk}')">저장</button>
    </div>
  </div>`;
  h+=`<div class="fb-wrap"><div class="fb-t">💬 선생님 피드백</div>
    ${feedbacks.length?feedbacks.slice(0,10).map(([k,v])=>`
      <div class="fb-item">${v.text||v}<div class="fb-m">${k.replace(/_/g,'-')}</div></div>`).join('')
    :`<div style="font-size:12px;color:var(--text3);text-align:center;padding:14px">아직 피드백이 없습니다</div>`}
  </div>`;ct.innerHTML=h;
}
function saveMemo(tk){
  const val=document.getElementById('memoTa').value;
  ep('memos',curStudent)[tk]={text:val,time:new Date().toISOString()};save();
  const btn=document.getElementById('saveMemoBtn');
  if(btn){btn.textContent='저장됨 ✓';btn.style.background='var(--green2)';setTimeout(()=>{btn.textContent='저장';btn.style.background='';},1500);}
}
window.addEventListener('scroll',()=>{
  const f=document.getElementById('fabAdmin');
  if(f)f.classList.toggle('on',scrollY>300);
});
load();
</script>

</body></html>
