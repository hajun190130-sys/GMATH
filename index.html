<!DOCTYPE html>

<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>지수학 스터디</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#141d3a;--bg2:#1e2a4e;--bg3:#182343;--bg4:#283561;
  --border:rgba(140,164,230,.22);--border2:rgba(140,164,230,.42);
  --text:#f2f4fb;--text2:#c6cfe8;--text3:#93a0c4;
  --blue:#1c2f6e;--blue2:#4d7cff;--blue3:#7ea2ff;--blue-l:rgba(95,138,255,.18);
  --green:#2e7d62;--green2:#4fc59b;--green3:#5fd6ab;--green-l:rgba(79,197,155,.17);
  --amber:#b9854a;--amber2:#dba75c;--amber-l:rgba(219,167,92,.17);
  --red:#b35c5c;--red2:#e07a7a;--red-l:rgba(224,122,122,.17);
  --gold:#cfb27a;--gold2:#e2cb98;--gold-l:rgba(207,178,122,.16);
  --serif:'Noto Serif KR','Cormorant Garamond',serif;
  --r:14px;--r2:10px;--r3:7px;
  --shadow:0 4px 16px rgba(4,9,28,.32);
  --shadow2:0 14px 40px rgba(4,9,28,.45);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overflow-x:hidden;color-scheme:dark}
input[type=date],input[type=number]{color-scheme:dark}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.scr{display:none}.scr.on{display:block}

/* ── 버튼 ── */
.btn{border:none;border-radius:var(--r2);padding:10px 16px;font:600 13px/1 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn-blue{background:var(--blue2);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}.btn-blue:active{opacity:.85}
.btn-ghost{background:var(--bg3);border:1px solid var(--border2);color:var(--text2)}.btn-ghost:active{background:var(--bg4)}
.btn-green{background:var(--green2);color:#fff}.btn-green:active{opacity:.85}
.btn-red{background:var(--red-l);border:1px solid rgba(220,38,38,.3);color:var(--red2)}
.btn-sm{padding:6px 12px;font-size:11px}.btn-full{width:100%}

/* ── 입력 ── */
.inp{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:11px 13px;color:var(--text);font:14px 'Noto Sans KR',sans-serif;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}.inp::placeholder{color:var(--text3)}
.ta{resize:vertical;min-height:70px;line-height:1.7}

/* ════ HOME ════ */
#scrHome{background:radial-gradient(120% 70% at 50% -8%,#33509f 0%,#21305f 40%,#141d3a 80%);min-height:100vh}
@keyframes heroGlow{0%,100%{opacity:.5}50%{opacity:1}}
.hero-eyebrow{font:600 9px 'Noto Sans KR';letter-spacing:.42em;color:var(--gold);text-transform:uppercase;text-align:center;margin-bottom:22px}
.hero-rule{display:flex;align-items:center;gap:14px;justify-content:center;margin:18px 0 10px}
.hero-rule span{flex:0 0 52px;height:1px;background:linear-gradient(90deg,transparent,rgba(207,178,122,.55))}
.hero-rule span:last-child{background:linear-gradient(90deg,rgba(207,178,122,.55),transparent)}
.hero-rule b{font:500 9px 'Noto Sans KR';letter-spacing:.34em;color:var(--text3);text-transform:uppercase;font-weight:500}
.hero-title{font-family:var(--serif);font-size:54px;font-weight:600;color:#f4f1e8;letter-spacing:.06em;line-height:1.05;text-align:center}
.hero-sub{font:500 10px 'Noto Sans KR';letter-spacing:.52em;color:rgba(244,241,232,.55);text-align:center;margin-top:10px;text-indent:.52em}
.hero-quote{font-family:var(--serif);font-style:italic;font-size:13px;color:rgba(207,178,122,.8);text-align:center;margin-top:22px;letter-spacing:.04em}
.home-inner{max-width:500px;margin:0 auto;padding:52px 20px 70px}
.home-top{margin-bottom:42px;text-align:center}
.home-logo{width:108px;height:108px;object-fit:contain;background:rgba(244,241,232,.96);border-radius:50%;padding:16px;box-shadow:0 0 0 1px rgba(207,178,122,.5),0 0 0 7px rgba(207,178,122,.07),0 18px 48px rgba(2,6,20,.6);animation:heroGlow 6s ease-in-out infinite}
.home-logo-t .n1{font-size:30px;font-weight:900;color:#fff;letter-spacing:-1px}
.home-logo-t .n2{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:3px;margin-top:2px}
.home-card{background:rgba(255,255,255,.07);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow2);overflow:hidden;margin-bottom:12px}
.home-admin-btn{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .2s;background:transparent;border:none;width:100%;text-align:left}
.home-admin-btn:active{background:rgba(255,255,255,.1)}
.home-admin-btn .t{font-size:15px;font-weight:700;color:var(--text)}
.home-admin-btn .s{font-size:11px;color:var(--text3);margin-top:3px}
.home-admin-btn .ar{font-size:22px;color:var(--gold)}
.home-sec{font-size:9px;font-weight:600;color:var(--gold);letter-spacing:.38em;text-transform:uppercase;margin-bottom:10px;padding:0 2px}
.stu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stu-btn{background:rgba(255,255,255,.07);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--r2);padding:14px 12px;cursor:pointer;text-align:center;transition:all .18s;position:relative;box-shadow:0 2px 8px rgba(30,64,175,.08)}
.stu-btn:active{transform:scale(.97);box-shadow:none}
.stu-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--border);margin:0 auto 8px;transition:.2s}
.stu-btn.done .dot{background:var(--green3);box-shadow:0 0 8px rgba(16,185,129,.4)}
.stu-btn .nm{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--text);letter-spacing:.04em}
.stu-btn .gr{font-size:10px;color:var(--text3);margin-top:2px}
.stu-btn .qbadge{position:absolute;top:7px;right:9px;background:var(--red2);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px}

/* ════ PIN ════ */
.overlay{position:fixed;inset:0;background:rgba(14,30,80,.7);z-index:900;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}.overlay.on{display:flex}
.pin-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:28px 22px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.pin-box .pt{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.pin-box .ps{font-size:12px;color:var(--text3);margin-bottom:20px;line-height:1.5}
.pin-btns{display:flex;gap:8px;margin-top:14px}.pin-btns .btn{flex:1}
.errmsg{font-size:11px;color:var(--red2);margin-top:5px;min-height:15px}

/* ════ HEADER ════ */
.app-hd{background:rgba(24,33,64,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(30,64,175,.08)}
.hd-back{background:none;border:none;color:var(--blue2);font-size:22px;cursor:pointer;padding:0 6px 0 0;line-height:1;flex-shrink:0}
.hd-logo{width:44px;height:44px;object-fit:contain;flex-shrink:0;background:var(--bg2);border-radius:10px;padding:3px;border:1px solid var(--border)}
.hd-info{flex:1;min-width:0}
.hd-title{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-sub{font-size:9px;color:var(--text3)}
.hd-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--green3);opacity:0;transition:opacity .3s}.sdot.on{opacity:1}

/* ════ TABS ════ */
.tab-bar{background:var(--bg3);border-bottom:1px solid var(--border);padding:0 12px;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:0}
.tab{padding:10px 12px;border:none;background:transparent;color:var(--text3);font:500 11px 'Noto Sans KR',sans-serif;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;flex-shrink:0}
.tab.on{color:var(--gold2);border-bottom-color:var(--gold);font-weight:700}

/* ════ DATE BAR ════ */
.date-bar{background:var(--bg3);border-bottom:1px solid var(--border);padding:6px 10px;display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.dbt{padding:4px 9px;border-radius:var(--r3);border:1px solid var(--border);background:var(--bg2);color:var(--text3);font:11px 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;flex-shrink:0;white-space:nowrap}
.dbt.on{background:var(--blue2);border-color:var(--blue2);color:#fff;font-weight:700}.dbt.td{border-color:var(--blue2);color:var(--blue2)}

/* ════ CONTENT ════ */
.ct{padding:12px 13px 80px}

/* ── 카드 ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-hd{font-size:9px;font-weight:600;color:var(--gold);letter-spacing:.32em;text-transform:uppercase;margin-bottom:12px}

/* ── 날짜 요약 카드 ── */
.day-card{background:linear-gradient(135deg,#27409a 0%,#3a5cc8 100%);border:1px solid rgba(126,162,255,.28);border-top:2px solid var(--gold);border-radius:var(--r);padding:17px;margin-bottom:12px;color:#fff;box-shadow:0 10px 30px rgba(39,64,154,.4)}
.day-card .dt{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.03em}
.day-card .ds{font-size:11px;opacity:.8;margin-top:3px}
.day-progbar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;margin-top:10px}
.day-progfill{height:100%;border-radius:3px;background:var(--gold2);transition:width .5s}

/* ── 학생 행 ── */
.srow{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:12px 13px;margin-bottom:8px;box-shadow:0 1px 4px rgba(30,64,175,.06)}
.srow-hd{display:flex;align-items:center;gap:9px;margin-bottom:10px;cursor:pointer}
.chk{width:20px;height:20px;border-radius:5px;border:2px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;flex-shrink:0}
.chk.on{background:var(--green2);border-color:var(--green2);color:#fff}
.snm{font-size:14px;font-weight:700;flex:1;color:var(--text)}
.sgr{font-size:10px;color:var(--text3)}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.b-done{background:var(--green-l);color:var(--green2);border:1px solid var(--green3)}
.b-wip{background:var(--amber-l);color:var(--amber2);border:1px solid var(--amber2)}
.b-none{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.chip{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--bg4);color:var(--text3);border:1px solid var(--border)}

/* ── 요약바 ── */
.sumbar{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px}
.si{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:9px 13px;flex-shrink:0;text-align:center;min-width:64px;box-shadow:0 1px 4px rgba(30,64,175,.06)}
.sv{font-size:20px;font-weight:800;line-height:1}.sl{font-size:9px;color:var(--text3);margin-top:3px}
.cb{color:var(--blue2)}.cg{color:var(--green2)}.ca{color:var(--amber2)}.cc{color:#0891b2}.cr{color:var(--red2)}

/* ── 통계 ── */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.sg3{grid-template-columns:repeat(3,1fr)}
.sbox{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:12px;box-shadow:0 1px 4px rgba(30,64,175,.06)}
.sbl{font-size:9px;color:var(--text3);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.sbv{font-size:22px;font-weight:800;line-height:1;color:var(--text)}.sbv .u{font-size:10px;font-weight:400;color:var(--text3);margin-left:2px}

/* ── 번호별 체크리스트 ── */
.tasklist{margin:0 0 14px}
.ti{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r3);margin-bottom:6px;border:1px solid var(--border);background:var(--bg3);transition:all .2s}
.ti.s-done{background:var(--green-l);border-color:var(--green3)}
.ti.s-wip{background:var(--amber-l);border-color:var(--amber2)}
.ti-num{font-size:13px;font-weight:800;color:var(--blue2);flex-shrink:0;width:22px;margin-top:2px}
.ti.s-done .ti-num{color:var(--green2)}.ti.s-wip .ti-num{color:var(--amber2)}
.ti-text{font-size:13px;line-height:1.6;flex:1;color:var(--text);transition:all .2s}
.ti.s-done .ti-text{text-decoration:line-through;color:var(--text3)}
.ti-status{flex-shrink:0}
.status-btn{border:none;border-radius:20px;padding:3px 10px;font:600 10px 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .2s;white-space:nowrap}
.sb-none{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.sb-wip{background:var(--amber-l);color:var(--amber2);border:1px solid var(--amber2)}
.sb-done{background:var(--green-l);color:var(--green2);border:1px solid var(--green3)}
.ti-wide{flex-wrap:wrap}
.ti-body{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.crit-tag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.3px;padding:1px 7px;border-radius:20px;background:var(--blue-l);color:var(--blue3);vertical-align:middle}
.ti-crit{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crit-score{width:78px!important;padding:8px!important;text-align:center;font-weight:700}
.crit-of{font-size:12px;color:var(--text3)}
.pass-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.pass-y{background:var(--green-l);color:var(--green2);border:1px solid var(--green3)}
.pass-n{background:var(--red-l);color:var(--red2);border:1px solid var(--red2)}
.pass-rec{background:var(--bg4);color:var(--text2);border:1px solid var(--border)}
.crit-cut{font-size:10px;color:var(--text3)}
.crit-range{flex:1;accent-color:var(--blue2);height:4px}
.rate-pct{font-size:13px;font-weight:800;color:var(--blue2);min-width:46px;text-align:right}
.crit-rbar{height:6px;background:var(--bg4);border-radius:10px;overflow:hidden}
.crit-rfill{height:100%;background:linear-gradient(90deg,var(--blue2),var(--green2));border-radius:10px;transition:width .2s}

/* ── 공부시간 ── */
.study-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.study-hd{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px}
.study-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.slbl{font-size:12px;color:var(--text2);width:80px;flex-shrink:0;font-weight:600}
.sinp{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r3);padding:9px 10px;color:var(--text);font:700 16px 'Noto Sans KR',sans-serif;outline:none;width:90px;text-align:center}
.sinp:focus{border-color:var(--blue2)}
.sunit{font-size:12px;color:var(--text3)}
.goal-bar{height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;margin-top:4px;border:1px solid var(--border)}
.goal-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue2),var(--gold2));transition:width .5s}
.goal-text{font-size:10px;color:var(--text3);margin-top:4px;text-align:right}

/* ── 마감일 ── */
.dl-wrap{background:var(--bg4);border-radius:var(--r3);padding:10px 12px;margin-top:8px;border:1px solid var(--border)}
.dl-t{font-size:10px;color:var(--text3);font-weight:600;margin-bottom:8px}
.dl-opts{display:flex;gap:16px;align-items:center}
.dl-opt{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:var(--text2);font-weight:500}
.dl-opt input[type=radio]{accent-color:var(--blue2)}
.dl-date-inp{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r3);padding:7px 10px;color:var(--text);font:12px 'Noto Sans KR',sans-serif;outline:none;margin-top:8px;width:100%}
.dl-badge{display:inline-flex;align-items:center;font-size:10px;padding:2px 9px;border-radius:20px;font-weight:700}
.dl-today{background:var(--red-l);color:var(--red2);border:1px solid rgba(220,38,38,.3)}
.dl-date{background:var(--amber-l);color:var(--amber2);border:1px solid rgba(217,119,6,.3)}

/* ── 자기평가 (완료하기 대체) ── */
.selfeval{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.selfeval-hd{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px}
.star-row{display:flex;gap:6px;margin-bottom:10px}
.star{font-size:26px;cursor:pointer;transition:transform .1s;filter:grayscale(1);opacity:.4}
.star.on{filter:none;opacity:1;transform:scale(1.1)}
.mood-row{display:flex;gap:8px;flex-wrap:wrap}
.mood-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);font:600 12px 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;color:var(--text2)}
.mood-btn.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}

/* ── 오늘 데일리 카드 ── */
.task-card{background:linear-gradient(135deg,rgba(37,99,235,.06),rgba(30,64,175,.03));border:1px solid rgba(37,99,235,.2);border-radius:var(--r);padding:16px;margin-bottom:10px}
.task-lbl{font-size:9px;color:var(--blue2);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.task-empty{font-size:13px;color:var(--text3);text-align:center;padding:14px 0}
.task-meta{font-size:10px;color:var(--text3);margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}

/* ── 달력 ── */
.cal-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.cal-nav-t{font-size:14px;font-weight:700;color:var(--text)}
.cal-nav-b{display:flex;gap:5px;flex-wrap:wrap}
.mnbtn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r3);padding:5px 11px;color:var(--text2);font:600 11px 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s}
.mnbtn.on{background:var(--blue2);border-color:var(--blue2);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-hd{font-size:9px;color:var(--text3);text-align:center;padding:3px 0;font-weight:600}
.cal-hd.sun{color:var(--red2)}.cal-hd.sat{color:var(--blue2)}
.cal-day{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:3px;min-height:38px;cursor:pointer;transition:all .15s}
.cal-day.td{border-color:var(--blue2);background:var(--blue-l)}.cal-day.fut{opacity:.35;cursor:default}
.cal-day .dn{font-size:9px;font-weight:600;text-align:center;color:var(--text)}
.cal-day.sun .dn{color:var(--red2)}.cal-day.sat .dn{color:var(--blue2)}
.cal-day .dh{font-size:8px;color:var(--blue2);text-align:center}
.cdot{width:4px;height:4px;border-radius:50%;margin:2px auto}
.cd-ok{background:var(--green2)}.cd-no{background:var(--border2)}

/* ── 통계 차트 ── */
.wchart{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.wct{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px}
.wbars{display:flex;align-items:flex-end;gap:5px;height:72px}
.wbw{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.wb{width:100%;border-radius:3px 3px 0 0;min-height:3px;transition:height .5s}
.wb-t{background:linear-gradient(180deg,var(--blue2),var(--blue3))}.wb-p{background:rgba(37,99,235,.25)}
.wl{font-size:8px;color:var(--text3);text-align:center}.wv{font-size:8px;color:var(--text3);text-align:center}
.rchart{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.rct{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px}
.rrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rnm{font-size:11px;color:var(--text2);width:52px;text-align:right;flex-shrink:0}
.rtk{flex:1;height:18px;background:var(--bg4);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.rfl{height:100%;border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;font-size:8px;font-weight:700;color:#fff;min-width:3px;transition:width .6s}
.rme{background:linear-gradient(90deg,var(--blue),var(--blue3))}.rot{background:linear-gradient(90deg,rgba(37,99,235,.4),rgba(59,130,246,.6))}
.rrk{font-size:10px;color:var(--text3);width:18px;text-align:center}

/* ── Q&A ── */
.qa-thread{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.qa-msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;position:relative}
.qa-msg.stu{background:var(--blue-l);color:var(--blue);border-bottom-left-radius:4px;align-self:flex-start;border:1px solid rgba(37,99,235,.2)}
.qa-msg.teacher{background:var(--green-l);color:var(--green);border-bottom-right-radius:4px;align-self:flex-end;border:1px solid rgba(16,185,129,.3)}
.qa-msg-meta{font-size:9px;opacity:.6;margin-top:4px}
.qa-pending{font-size:11px;color:var(--text3);font-style:italic;padding:6px 0}
.qa-input-area{background:var(--bg3);border-top:1px solid var(--border);padding:12px;position:sticky;bottom:0}
.qa-input-row{display:flex;gap:8px}
.qa-student-list .qsi{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:all .15s}
.qa-student-list .qsi:hover{background:var(--bg3)}
.qa-student-list .qsi:last-child{border-bottom:none}
.qbadge-lg{background:var(--red2);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}

/* ── 비교 ── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:12px 13px;margin-bottom:10px;box-shadow:var(--shadow)}
.tg-info .tl{font-size:12px;font-weight:600;color:var(--text)}.tg-info .ts{font-size:10px;color:var(--text3);margin-top:2px}
.sw{position:relative;width:44px;height:25px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .sl{position:absolute;inset:0;background:var(--bg4);border:1px solid var(--border2);border-radius:20px;cursor:pointer;transition:.25s}
.sw .sl::before{content:'';position:absolute;width:19px;height:19px;left:2px;top:2px;background:var(--text3);border-radius:50%;transition:.25s}
.sw input:checked+.sl{background:rgba(5,150,105,.15);border-color:var(--green2)}
.sw input:checked+.sl::before{transform:translateX(19px);background:var(--green2)}
.ctable{width:100%;border-collapse:collapse}
.ctable th{font-size:10px;color:var(--text3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-weight:600}
.ctable td{font-size:12px;padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.rnk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700}
.r1{background:rgba(245,158,11,.15);color:var(--amber2)}.r2{background:rgba(148,163,184,.15);color:#64748b}
.r3{background:rgba(180,83,9,.12);color:#92400e}.rn{background:var(--bg4);color:var(--text3)}

/* ── 메모/피드백 ── */
.fb-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.fb-t{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:10px}
.fb-item{background:var(--bg3);border-radius:var(--r3);padding:10px;margin-bottom:6px;font-size:12px;line-height:1.6;color:var(--text);border:1px solid var(--border)}
.fb-m{font-size:10px;color:var(--text3);margin-top:3px}
.memo-ta{width:100%;min-height:100px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r3);padding:10px;color:var(--text);font:12px/1.7 'Noto Sans KR',sans-serif;resize:vertical;outline:none}.memo-ta:focus{border-color:var(--blue2)}

/* ── 기타 ── */
.divlbl{font-size:9px;color:var(--gold);font-weight:600;letter-spacing:.32em;text-transform:uppercase;padding:8px 0 6px;border-bottom:1px solid rgba(207,178,122,.22);margin-bottom:12px}
.fab{position:fixed;bottom:20px;right:16px;width:42px;height:42px;border-radius:50%;background:var(--blue2);border:none;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 16px rgba(37,99,235,.3);z-index:80;display:none;align-items:center;justify-content:center}.fab.on{display:flex}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}.empty .ei{font-size:28px;margin-bottom:10px}
.set-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}.set-row:last-child{border-bottom:none}
.nqbadge{display:inline-flex;align-items:center;justify-content:center;background:var(--red2);color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 5px;margin-left:3px;vertical-align:middle}
.auto-num-hint{font-size:10px;color:var(--text3);margin-top:4px}
@media(max-width:380px){.stu-grid{grid-template-columns:1fr 1fr}.sg3{grid-template-columns:1fr 1fr}}

/* ════ 라운지 ════ */
.lg-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.lg-title{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.05em;color:var(--text)}
.lg-sub{font-size:9px;color:var(--gold);letter-spacing:.3em;text-transform:uppercase;font-weight:600;margin-top:2px}
.lg-tools{display:flex;gap:6px;flex-wrap:wrap}
.lg-feed{display:flex;flex-direction:column;gap:10px;padding:4px 0 12px;min-height:200px}
.msg{max-width:86%;display:flex;flex-direction:column;gap:4px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.other{align-self:flex-start;align-items:flex-start}
.msg-meta{font-size:9px;color:var(--text3);letter-spacing:.06em;padding:0 4px;display:flex;gap:6px;align-items:center}
.msg-meta .who{font-weight:700;color:var(--text2)}
.msg-meta .who.tch{color:var(--gold2)}
.msg-del{background:none;border:none;color:var(--text3);font-size:10px;cursor:pointer;padding:0 2px}
.bubble{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:10px 13px;font-size:13.5px;line-height:1.75;color:var(--text);word-break:break-word;white-space:pre-wrap}
.msg.me .bubble{background:rgba(77,124,255,.16);border-color:rgba(77,124,255,.35);border-bottom-right-radius:4px}
.msg.other .bubble{border-bottom-left-radius:4px}
.bubble img{max-width:100%;border-radius:9px;display:block;background:#fff}
.bubble .katex{font-size:1.05em}
.mission-card{border:1px solid rgba(207,178,122,.45);border-top:2px solid var(--gold);background:linear-gradient(160deg,rgba(207,178,122,.10),rgba(207,178,122,.03));border-radius:14px;padding:13px 15px;max-width:100%}
.mission-lbl{font-size:9px;font-weight:600;color:var(--gold);letter-spacing:.32em;text-transform:uppercase;margin-bottom:8px}
.mission-q{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap}
.quiz-card{border:1px solid rgba(126,162,255,.4);border-top:2px solid var(--blue3);background:rgba(77,124,255,.07);border-radius:14px;padding:13px 15px}
.quiz-lbl{font-size:9px;font-weight:600;color:var(--blue3);letter-spacing:.32em;text-transform:uppercase;margin-bottom:8px}
.quiz-q{font-size:14px;line-height:1.75;color:var(--text);margin-bottom:11px;white-space:pre-wrap}
.qopt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:6px;color:var(--text2);font:500 13px 'Noto Sans KR';cursor:pointer;transition:all .15s}
.qopt:active{background:var(--bg4)}
.qopt.sel{border-color:var(--blue3);background:rgba(77,124,255,.14);color:var(--text)}
.qopt.correct{border-color:var(--green3);background:var(--green-l);color:var(--green2);font-weight:700}
.qopt.wrongpick{border-color:var(--red2);background:var(--red-l);color:var(--red2)}
.qopt .qn{font-family:var(--serif);font-weight:600;color:var(--gold);width:16px;flex-shrink:0}
.qopt .qcount{margin-left:auto;font-size:10px;color:var(--text3)}
.quiz-result{font-size:11px;margin-top:6px;font-weight:700}
.lg-inputbar{position:sticky;bottom:0;background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:9px;box-shadow:var(--shadow2)}
.lg-quick{display:flex;gap:5px;overflow-x:auto;padding-bottom:7px;-webkit-overflow-scrolling:touch}
.lg-qbtn{flex-shrink:0;background:var(--bg4);border:1px solid var(--border);border-radius:7px;color:var(--gold2);font:600 11px 'Noto Sans KR';padding:4px 9px;cursor:pointer}
.lg-row{display:flex;gap:7px;align-items:flex-end}
.lg-ta{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:9px 11px;color:var(--text);font:13.5px 'Noto Sans KR';line-height:1.6;outline:none;resize:none;min-height:42px;max-height:120px}
.lg-ic{width:40px;height:40px;flex-shrink:0;border-radius:10px;background:var(--bg4);border:1px solid var(--border);color:var(--text2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lg-send{width:46px;height:40px;flex-shrink:0;border:none;border-radius:10px;background:linear-gradient(135deg,var(--blue2),#2c4ba8);color:#fff;font-size:16px;cursor:pointer;box-shadow:0 4px 14px rgba(77,124,255,.35)}
.lg-hint{font-size:9.5px;color:var(--text3);margin-top:6px;padding:0 2px;letter-spacing:.02em}
/* 드로잉 모달 */
.draw-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:14px;width:100%;max-width:380px}
.draw-box .dt2{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:10px;color:var(--text)}
#drawCv{background:#fff;border-radius:10px;touch-action:none;width:100%;display:block}
.draw-tools{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.dr-color{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.dr-color.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(207,178,122,.3)}
.dr-w{background:var(--bg4);border:1px solid var(--border);border-radius:7px;color:var(--text2);font:600 11px 'Noto Sans KR';padding:4px 9px;cursor:pointer}
.dr-w.on{color:var(--gold2);border-color:var(--gold)}

// ── 번호 + 완료기준 파싱 ──
function parseItemLine(line){
  const m=line.match(/^\s*(\d+)[.)\s]\s*(.+)/);
  if(!m)return null;
  let body=m[2].trim();
  let type='check',max=100,cut=null,cutRel=false;
  const ci=body.indexOf('::');
  if(ci>=0){
    const spec=body.slice(ci+2).trim();
    body=body.slice(0,ci).trim();
    const head=(spec.split(/\s+/)[0]||'').toLowerCase();
    const nums=(spec.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);
    if(head.indexOf('시험')===0||head.indexOf('테스트')===0||head==='test'){
      type='test';
      if(nums.length>=1)max=nums[0];
      if(nums.length>=2){if(nums[1]<0){cutRel=true;cut=Math.abs(nums[1]);}else{cut=nums[1];}}
    }else if(head.indexOf('완료율')===0||head.indexOf('진도')===0||head==='%'||head==='rate'){
      type='rate';
    }else{type='check';}
  }
  return {num:parseInt(m[1]),text:body,type,max,cut,cutRel};
}
function parseItems(text){if(!text)return[];return text.split('\n').map(parseItemLine).filter(Boolean);}
function stripCrit(text){return String(text||'').split('\n').map(l=>{const i=l.indexOf('::');return i>=0?l.slice(0,i).trimEnd():l;}).join('\n');}
function passOf(item,score){if(item.cut==null||score==null||isNaN(score))return null;return item.cutRel?(item.max-score)<=item.cut:score>=item.cut;}
function itemState(sd,i,item){
  if(item.type==='test'){
    const sc=(sd.itemScore||{})[i];
    if(sc===undefined||sc===null||sc==='')return 'none';
    if(item.cut==null)return 'done';
    return passOf(item,Number(sc))?'done':'wip';
  }
  if(item.type==='rate'){
    const r=Number((sd.itemRate||{})[i]||0);
    return r>=100?'done':r>0?'wip':'none';
  }
  const s=(sd.itemStatus||{})[i];return s||'none';
}
function recomputeDone(sd,items){sd.done=items.length>0&&items.every((it,i)=>itemState(sd,i,it)==='done');if(sd.done&&!sd.doneTime)sd.doneTime=new Date().toISOString();}

// ── 자동 번호 입력 ──
function autoNumKeydown(e){
  const ta=e.target;
  if(e.key==='Enter'){
    e.preventDefault();
    const val=ta.value,pos=ta.selectionStart;
    const before=val.substring(0,pos);
    const lines=before.split('\n');
    const last=lines[lines.length-1];
    const m=last.match(/^(\d+)[.)]/);
    if(m){
      const next=parseInt(m[1])+1;
      const ins='\n'+next+'. ';
      ta.value=before+ins+val.substring(pos);
      const np=pos+ins.length;
      ta.setSelectionRange(np,np);
    }else{
      const ins='\n';
      ta.value=before+ins+val.substring(pos);
      const np=pos+ins.length;
      ta.setSelectionRange(np,np);
    }
  }
  if(e.key==='Tab'){e.preventDefault();
    if(!ta.value.trim()){ta.value='1. ';ta.setSelectionRange(3,3);}
  }
}
function initAutoNum(ta){
  if(!ta.value.trim()){ta.value='1. ';ta.setSelectionRange(3,3);}
}

// ── 통계 ──
function calcStats(name){
  const st={totalHours:0,doneDays:0,streak:0,weekHours:Array(7).fill(0),monthMap:{}};
  MONTHS.forEach(mc=>{
    const md=DB[mc.key];if(!md)return;
    for(let d=1;d<=mc.days;d++){
      const dk="d"+String(d).padStart(2,"0");
      const day=md[dk];if(!day||!day.students||!day.students[name])continue;
      const sd=day.students[name];
      const h=parseFloat(sd.hours||sd.studyHours||0)||0;
      st.totalHours+=h;
      if(sd.done)st.doneDays++;
      const dkey=`${mc.y}-${String(mc.m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      st.monthMap[dkey]={h,done:sd.done};
    }
  });
  for(let i=0;i<7;i++){
    const dt=new Date(_now);dt.setDate(dt.getDate()-i);
    const dk=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
    st.weekHours[6-i]=(st.monthMap[dk]||{}).h||0;
  }
  for(let i=0;i<60;i++){
    const dt=new Date(_now);dt.setDate(dt.getDate()-i);
    const dk=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
    if((st.monthMap[dk]||{}).done)st.streak++;else break;
  }
  const tf=`${TODAY.y}-${String(TODAY.m).padStart(2,"0")}-${String(TODAY.d).padStart(2,"0")}`;
  const yf=(()=>{const dt=new Date(_now);dt.setDate(dt.getDate()-1);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
  })();
  const lf=(()=>{const dt=new Date(_now);dt.setDate(dt.getDate()-7);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
  })();
  st.todayH=(st.monthMap[tf]||{}).h||0;
  st.yesterH=(st.monthMap[yf]||{}).h||0;
  st.lwH=(st.monthMap[lf]||{}).h||0;
  return st;
}

  const entries=Object.entries(CHAT).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));
  if(!entries.length){feed.innerHTML=`<div class="empty" style="padding:40px 0;text-align:center;color:var(--text3);font-size:12px">아직 글이 없어요.<br>첫 메시지를 남겨보세요 ✨</div>`;return;}
  feed.innerHTML=entries.map(([id,m])=>{
    const mine=m.who===me;
    const delBtn=(isAdmin||mine)?`<button class="msg-del" onclick="delMsg('${id}')">✕</button>`:'';
    const meta=`<div class="msg-meta">${mine?'':`<span class="who ${m.role==='t'?'tch':''}">${esc(m.who)}</span>`}<span>${fmtT(m.ts)}</span>${delBtn}</div>`;
    let body='';
    if(m.t==='text')body=`<div class="bubble">${esc(m.txt)}</div>`;
    else if(m.t==='draw'||m.t==='img')body=`<div class="bubble" style="padding:5px"><img src="${m.img}" alt="첨부"></div>`;
    else if(m.t==='mission')body=`<div class="mission-card"><div class="mission-lbl">Mission · 선생님</div><div class="mission-q">${esc(m.txt)}</div></div>`;
    else if(m.t==='quiz')body=renderQuizCard(id,m,me,isAdmin);
    return `<div class="msg ${mine?'me':'other'}">${meta}${body}</div>`;
  }).join('');
  renderMathIn(feed);
  requestAnimationFrame(()=>{feed.scrollTop=feed.scrollHeight;window.scrollTo(0,document.body.scrollHeight);});
}
function renderQuizCard(id,m,me,isAdmin){
  const votes=m.votes||{};
  const myPick=votes[me];
  const revealed=isAdmin||myPick!==undefined;
  const counts=(m.opts||[]).map((_,i)=>Object.values(votes).filter(v=>v===i).length);
  const opts=(m.opts||[]).map((o,i)=>{
    let cls='qopt';
    if(revealed){
      if(i===m.ans)cls+=' correct';
      else if(myPick===i)cls+=' wrongpick';
    }else if(myPick===i)cls+=' sel';
    const click=(!isAdmin&&myPick===undefined)?`onclick="voteQuiz('${id}',${i})"`:'';
    return `<button class="${cls}" ${click}><span class="qn">${i+1}</span><span>${esc(o)}</span>${revealed?`<span class="qcount">${counts[i]}명</span>`:''}</button>`;
  }).join('');
  let result='';
  if(!isAdmin&&myPick!==undefined)result=`<div class="quiz-result" style="color:${myPick===m.ans?'var(--green2)':'var(--red2)'}">${myPick===m.ans?'⭕ 정답입니다!':'❌ 아쉬워요 — 정답은 '+(m.ans+1)+'번'}</div>`;
  if(isAdmin)result=`<div class="quiz-result" style="color:var(--text3)">${Object.keys(votes).length}명 응시 · ${Object.values(votes).filter(v=>v===m.ans).length}명 정답</div>`;
  return `<div class="quiz-card"><div class="quiz-lbl">Quiz</div><div class="quiz-q">${esc(m.q)}</div>${opts}${result}</div>`;
}
function pushMsg(o){
  if(!fbChat)return;
  o.who=myName();o.role=document.getElementById('scrAdmin').classList.contains('on')?'t':'s';o.ts=Date.now();
  fbChat.push(o);
}
function sendText(){
  const ta=document.getElementById('lgTa');const v=ta.value.trim();
  if(!v)return;pushMsg({t:'text',txt:v});ta.value='';ta.style.height='42px';
}
function insMath(s){
  const ta=document.getElementById('lgTa');if(!ta)return;
  const p=ta.selectionStart;ta.value=ta.value.slice(0,p)+s+ta.value.slice(ta.selectionEnd);
  ta.focus();const np=p+s.length-1;ta.setSelectionRange(np,np);
}
function delMsg(id){if(confirm('이 글을 삭제할까요?'))fbChat.child(id).remove();}
function clearLounge(){if(confirm('라운지의 모든 글을 삭제합니다. 계속할까요?'))fbChat.remove();}
function openMission(){
  const v=prompt('미션 문제를 입력하세요 (수식은 $ $ 사이에)');
  if(v&&v.trim())pushMsg({t:'mission',txt:v.trim()});
}
function sendQuiz(){
  const q=document.getElementById('qzQ').value.trim();
  const opts=document.getElementById('qzOpts').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,5);
  const ans=parseInt(document.getElementById('qzAns').value)-1;
  if(!q||opts.length<2||isNaN(ans)||ans<0||ans>=opts.length){alert('문제, 보기 2개 이상, 올바른 정답 번호를 입력하세요.');return;}
  pushMsg({t:'quiz',q,opts,ans,votes:{}});
  document.getElementById('quizOv').classList.remove('on');
  document.getElementById('qzQ').value='';document.getElementById('qzOpts').value='';document.getElementById('qzAns').value='';
}
function voteQuiz(id,idx){
  fbChat.child(id+'/votes/'+myName()).set(idx);
}
// ── 이미지 첨부 (리사이즈 후 base64) ──
function sendImage(inp){
  const f=inp.files[0];if(!f)return;inp.value='';
  const img=new Image();
  img.onload=()=>{
    const max=760;let w=img.width,h=img.height;
    if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
    let data=cv.toDataURL('image/jpeg',.72);
    if(data.length>900000)data=cv.toDataURL('image/jpeg',.45);
    if(data.length>1400000){alert('이미지가 너무 큽니다. 더 작은 사진으로 올려주세요.');return;}
    pushMsg({t:'img',img:data});
  };
  img.src=URL.createObjectURL(f);
}
// ── 드로잉 ──
let drCx=null,drDown=false,drCol='#111827',drW=4;
function openDraw(){
  document.getElementById('drawOv').classList.add('on');
  const cv=document.getElementById('drawCv');
  drCx=cv.getContext('2d');
  if(!cv._init){
    cv._init=true;
    drCx.fillStyle='#fff';drCx.fillRect(0,0,cv.width,cv.height);
    drCx.lineCap='round';drCx.lineJoin='round';
    const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
      return{x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height};};
    const st=e=>{e.preventDefault();drDown=true;const p=pos(e);drCx.beginPath();drCx.moveTo(p.x,p.y);drCx.lineTo(p.x,p.y);drCx.strokeStyle=drCol;drCx.lineWidth=drW;drCx.stroke();};
    const mv=e=>{if(!drDown)return;e.preventDefault();const p=pos(e);drCx.lineTo(p.x,p.y);drCx.strokeStyle=drCol;drCx.lineWidth=drW;drCx.stroke();};
    const en=()=>{drDown=false;};
    cv.addEventListener('mousedown',st);cv.addEventListener('mousemove',mv);window.addEventListener('mouseup',en);
    cv.addEventListener('touchstart',st,{passive:false});cv.addEventListener('touchmove',mv,{passive:false});cv.addEventListener('touchend',en);
  }
}
function drColor(c,el){drCol=c;document.querySelectorAll('.dr-color').forEach(d=>d.classList.remove('on'));if(el)el.classList.add('on');if(drW>20)drW=4;}
function drWidth(w,el){drW=w;document.querySelectorAll('.dr-w').forEach(d=>d.classList.remove('on'));if(el)el.classList.add('on');}
function drClear(){const cv=document.getElementById('drawCv');drCx.fillStyle='#fff';drCx.fillRect(0,0,cv.width,cv.height);}
function closeDraw(){document.getElementById('drawOv').classList.remove('on');}
function sendDraw(){
  const cv=document.getElementById('drawCv');
  pushMsg({t:'draw',img:cv.toDataURL('image/jpeg',.8)});
  drClear();closeDraw();
}
</script>
