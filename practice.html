<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지수학 모의고사 연습 기록</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,sans-serif;
       background:#F6F4EF;color:#22303F}
  .app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:48px}
  .header{background:#22303F;color:#fff;padding:16px 20px 0;position:sticky;top:0;z-index:10}
  .eyebrow{font-size:11px;letter-spacing:.18em;color:#8A99AB;font-weight:600}
  .title{font-size:19px;font-weight:800;margin-top:2px}
  .status{font-size:11px;font-weight:600;margin-top:3px;color:#8A99AB}
  .tabs{display:flex;gap:4px;margin-top:12px}
  .tab{flex:1;background:none;border:none;color:#8A99AB;font-size:13px;font-weight:700;
       padding:10px 0;cursor:pointer;font-family:inherit;border-bottom:2.5px solid transparent}
  .tab.on{color:#fff;border-bottom-color:#fff}
  .body{padding:16px}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;
        box-shadow:0 1px 3px rgba(34,48,63,.08)}
  .btn{background:#5F87AC;color:#fff;border:none;border-radius:10px;padding:13px 16px;
       font-size:15px;font-weight:700;width:100%;cursor:pointer;font-family:inherit}
  .btn-dark{background:#22303F}
  .btn-ghost{background:#fff;color:#22303F;border:1.5px solid #D5DAE2;border-radius:10px;
             padding:11px 16px;font-size:14px;font-weight:700;width:100%;cursor:pointer;font-family:inherit}
  .btn-sm{width:auto;padding:7px 12px;font-size:12px}
  .back{background:none;border:none;color:#8A99AB;font-size:14px;font-weight:600;cursor:pointer;
        padding:0;margin-bottom:10px;font-family:inherit}
  input,select,textarea{width:100%;border:1.5px solid #D5DAE2;border-radius:8px;padding:11px 12px;
        font-size:15px;margin-top:6px;background:#fff;font-family:inherit}
  label{font-size:12px;font-weight:700;color:#46586C;margin-top:12px;display:block}
  .hint{font-size:11.5px;color:#8A99AB;margin-top:5px;line-height:1.55}
  .sec{font-weight:800;font-size:14px;margin-bottom:8px}
  .pill-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .pill{flex:1;min-width:56px;padding:10px 0;border-radius:8px;font-weight:700;font-size:13.5px;
        border:1.5px solid #D5DAE2;background:#fff;color:#46586C;cursor:pointer;font-family:inherit}
  .pill.on{border:2px solid #5F87AC;background:#5F87AC;color:#fff}
  /* 문항 그리드 */
  .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:12px}
  .q{aspect-ratio:1;border-radius:9px;border:1.6px solid #D5DAE2;background:#fff;
     display:flex;flex-direction:column;align-items:center;justify-content:center;
     font-weight:800;font-size:14px;color:#46586C;cursor:pointer;font-family:inherit;user-select:none}
  .q .mark{font-size:11px;font-weight:700;margin-top:1px;color:#8A99AB}
  .q.ok{border-color:#2f9d76;background:rgba(47,157,118,.10);color:#1f7a5a}
  .q.ok .mark{color:#2f9d76}
  .q.no{border-color:#c65f5f;background:rgba(198,95,95,.12);color:#a34848}
  .q.no .mark{color:#c65f5f}
  .summary{display:flex;gap:8px;margin-top:14px}
  .sbox{flex:1;background:#F1F5F9;border-radius:10px;padding:12px;text-align:center}
  .sbox b{display:block;font-size:22px;font-weight:800;margin-top:2px}
  .sbox span{font-size:11px;color:#8A99AB;font-weight:700}
  .rowline{display:flex;align-items:center;gap:10px}
  .badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#22303F;color:#fff;
         padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:100;display:none;
         box-shadow:0 4px 12px rgba(0,0,0,.25);max-width:90vw;text-align:center}
  .empty{text-align:center;color:#46586C;padding:26px 14px;line-height:1.6}
  .x-btn{background:none;border:none;color:#C9CFDA;font-size:16px;cursor:pointer;padding:0;font-family:inherit}
  .bar-row{display:flex;align-items:center;gap:8px;margin-top:8px}
  .bar-label{font-size:12px;font-weight:700;width:92px;flex-shrink:0}
  .bar-track{flex:1;height:15px;background:#EDF0F5;border-radius:8px;overflow:hidden}
  .bar-fill{height:100%;border-radius:8px}
  .bar-num{font-size:11px;color:#46586C;width:44px;text-align:right;flex-shrink:0}
  /* 로그인 */
  .gate{min-height:100vh;background:#22303F;padding:28px 20px;display:flex;flex-direction:column;justify-content:center}
  .gate-in{max-width:340px;margin:0 auto;width:100%}
  .gate-t{color:#fff;font-weight:800;font-size:21px;text-align:center}
  .gate-s{color:#8A99AB;font-size:12px;letter-spacing:.14em;margin-top:6px;text-align:center}
  .stu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
  .stu-btn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);color:#fff;
           border-radius:10px;padding:13px 4px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .stu-btn:hover{background:rgba(255,255,255,.16)}
  .pin-in{margin-top:18px;text-align:center;font-size:24px;letter-spacing:12px;font-weight:800;
          padding:13px;border-radius:12px;border:none}
  .link-btn{background:none;border:none;color:#8A99AB;font-size:12.5px;font-weight:600;
            margin-top:18px;cursor:pointer;font-family:inherit;width:100%}
  table.pin{width:100%;border-collapse:collapse;margin-top:8px}
  table.pin td,table.pin th{border:1px solid #E3E7EE;padding:7px 6px;font-size:13px;text-align:center}
  table.pin input{margin-top:0;padding:6px;text-align:center;font-size:13px}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="gate" id="gate">
  <div class="gate-in">
    <div class="gate-t">지수학 모의고사 연습</div>
    <div class="gate-s">MOCK EXAM PRACTICE LOG</div>
    <div id="gate-body"></div>
  </div>
</div>

<!-- 본체 -->
<div class="app" id="app" style="display:none">
  <div class="header">
    <div class="eyebrow" id="hdr-eyebrow">지수학</div>
    <div class="title" id="hdr-title">모의고사 연습 기록</div>
    <div class="status" id="save-status">● 연결 중…</div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="body" id="main"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ═══════ 기본 데이터 ═══════ */
const DEFAULT_STUDENTS = [
  {name:"김하은", grade:"중3", school:"동부중", pin:"1101"},
  {name:"윤건후", grade:"중3", school:"동부중", pin:"1102"},
  {name:"오윤아", grade:"중3", school:"동부중", pin:"1103"},
  {name:"강나율", grade:"중3", school:"동부중", pin:"1104"},
  {name:"전지우", grade:"중3", school:"동부중", pin:"1105"},
  {name:"윤선후", grade:"고2", school:"신장고", pin:"0901"},
  {name:"이민혁", grade:"고2", school:"남한고", pin:"0902"},
  {name:"황윤성", grade:"고2", school:"남한고", pin:"0903"},
  {name:"임하영", grade:"고1", school:"남한고", pin:"1001"},
  {name:"김소율", grade:"고1", school:"남한고", pin:"1002"}
];
const ADMIN_PIN = "0604";
const DB_KEY = "mock_practice_v1";

// 과목별 문항 수
const SUBJECTS = {
  "수학":{q:30}, "국어":{q:45}, "영어":{q:45},
  "통합사회":{q:20}, "통합과학":{q:20}, "한국사":{q:20}, "사회":{q:20}, "과학":{q:20}
};
const EXAM_GRADES = ["고1","고2","고3"];
const EXAM_MONTHS = {
  "고1":[3,6,9,11], "고2":[3,6,9,11], "고3":[3,4,6,7,9,10,11]
};
function monthLabel(g,m){
  if(g==="고3"&&m===11) return "수능";
  if(g==="고3"&&(m===6||m===9)) return m+"월";
  return m+"월";
}
function examName(y,g,m){
  if(g==="고3"&&m===11) return `${y}년 수능`;
  const t = (g==="고3"&&(m===6||m===9)) ? "모의평가" : "학력평가";
  return `${y}년 ${m}월 ${g} ${t}`;
}

/* ═══════ 상태 ═══════ */
let students = [], attempts = [], tags = {};
let me = null;            // 로그인한 학생 (null이면 교사)
let isAdmin = false;
let view = "home", tab = "", chart = null;
let ST = {}, gateStep = "pick", gatePick = null;
let dbRef = null, connected = false, _selfWrite = 0, seeded = false;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thisYear = new Date().getFullYear();
const today = () => new Date().toISOString().slice(0,10);

/* ═══════ Firebase ═══════ */
function setStatus(t,c){ const e=document.getElementById("save-status"); if(e){e.textContent=t;e.style.color=c;} }
function initFirebase(cb){
  try{
    firebase.initializeApp({ databaseURL:"https://gmath-jibak-default-rtdb.firebaseio.com" });
    dbRef = firebase.database().ref(DB_KEY);
  }catch(e){
    setStatus("● 연결 실패 — 새로고침 필요","#E8A33D");
    if(!students.length) students = DEFAULT_STUDENTS.map(s=>({id:uid(), ...s}));
    renderGate(); cb&&cb(); return;
  }

  const to = setTimeout(()=>{ if(!connected){
    setStatus("● 연결 안 됨 — GitHub Pages 주소로 열어야 저장된다","#E8A33D");
    if(!students.length) students = DEFAULT_STUDENTS.map(s=>({id:uid(), ...s}));
    renderGate(); cb&&cb(); } }, 8000);

  dbRef.on("value", snap=>{
    clearTimeout(to); connected = true;
    setStatus("● 실시간 저장 중","#5CB87A");
    if(Date.now()-_selfWrite < 1500) return;
    const d = snap.val() || {};
    students = d.students || [];
    attempts = d.attempts || [];
    tags = d.tags || {};
    // 최초 1회: 명단이 비어 있으면 기본 명단 등록
    if(!students.length && !seeded){
      seeded = true;
      students = DEFAULT_STUDENTS.map(s=>({id:uid(), ...s}));
      persist();
    }
    if(me) me = students.find(s=>s.id===me.id) || me;
    if(document.getElementById("app").style.display !== "none") render();
    else renderGate();
    cb&&cb();
  }, ()=>{ clearTimeout(to); setStatus("● 연결 오류 — 새로고침 필요","#E8A33D"); cb&&cb(); });
}
function persist(){
  if(!dbRef) return;
  _selfWrite = Date.now();
  dbRef.update({students, attempts, tags, savedAt:Date.now()})
    .catch(()=> setStatus("● 저장 실패 — 인터넷 확인","#E8A33D"));
}
function toast(m){
  const t=document.getElementById("toast");
  t.textContent=m; t.style.display="block";
  setTimeout(()=>t.style.display="none", 2400);
}

/* ═══════ 로그인 화면 ═══════ */
function renderGate(){
  const g = document.getElementById("gate-body");
  if(!g) return;
  if(gateStep === "pick"){
    g.innerHTML = `
      <div class="stu-grid">
        ${students.map(s=>`<button class="stu-btn" onclick="pickStu('${s.id}')">${esc(s.name)}</button>`).join("")}
      </div>
      <button class="link-btn" onclick="gateStep='admin';renderGate()">선생님으로 들어가기</button>`;
  } else if(gateStep === "pin"){
    const s = students.find(x=>x.id===gatePick);
    g.innerHTML = `
      <div style="color:#fff;text-align:center;margin-top:24px;font-size:17px;font-weight:800">${esc(s?s.name:"")}</div>
      <input class="pin-in" id="pin-in" type="password" inputmode="numeric" maxlength="4" placeholder="····">
      <button class="btn" style="margin-top:14px" onclick="tryStuPin()">들어가기</button>
      <button class="link-btn" onclick="gateStep='pick';renderGate()">← 이름 다시 고르기</button>`;
    setTimeout(()=>document.getElementById("pin-in")?.focus(),80);
  } else {
    g.innerHTML = `
      <div style="color:#8A99AB;text-align:center;margin-top:24px;font-size:13px">선생님 PIN</div>
      <input class="pin-in" id="pin-in" type="password" inputmode="numeric" maxlength="4" placeholder="····">
      <button class="btn btn-dark" style="margin-top:14px;background:#c65f5f" onclick="tryAdminPin()">입장</button>
      <button class="link-btn" onclick="gateStep='pick';renderGate()">← 학생 화면으로</button>`;
    setTimeout(()=>document.getElementById("pin-in")?.focus(),80);
  }
}
function pickStu(id){ gatePick = id; gateStep = "pin"; renderGate(); }
function tryStuPin(){
  const v = document.getElementById("pin-in").value;
  const s = students.find(x=>x.id===gatePick);
  if(s && String(s.pin) === v){
    me = s; isAdmin = false;
    sessionStorage.setItem("mp_me", s.id);
    enterApp();
  } else { toast("PIN이 다르다"); document.getElementById("pin-in").value=""; }
}
function tryAdminPin(){
  const v = document.getElementById("pin-in").value;
  if(v === ADMIN_PIN){
    me = null; isAdmin = true;
    sessionStorage.setItem("mp_admin","1");
    enterApp();
  } else { toast("PIN이 다르다"); document.getElementById("pin-in").value=""; }
}
function logout(){
  sessionStorage.removeItem("mp_me"); sessionStorage.removeItem("mp_admin");
  me=null; isAdmin=false; gateStep="pick";
  document.getElementById("app").style.display="none";
  document.getElementById("gate").style.display="flex";
  renderGate();
}
function enterApp(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("hdr-eyebrow").textContent = isAdmin ? "지수학 · 선생님" : `지수학 · ${me.name}`;
  document.getElementById("hdr-title").textContent = isAdmin ? "연습 기록 관리" : "모의고사 연습 기록";
  tab = isAdmin ? "all" : "mine";
  view = "home";
  renderTabs(); render();
}
function renderTabs(){
  const t = document.getElementById("tabs");
  const list = isAdmin
    ? [["all","전체 기록"],["ana","오답 분석"],["stu","학생·PIN"]]
    : [["mine","내 기록"],["myana","내 오답"]];
  t.innerHTML = list.map(([k,l])=>
    `<button class="tab${k===tab?" on":""}" onclick="switchTab('${k}')">${l}</button>`).join("");
}
function switchTab(k){ tab=k; view="home"; renderTabs(); render(); }

/* ═══════ 계산 ═══════ */
function myAttempts(sid){
  return attempts.filter(a=>a.studentId===sid)
    .sort((a,b)=> (a.date>b.date?-1:1));
}
function attemptKey(a){ return `${a.year}_${a.examGrade}_${a.month}_${a.subject}`; }
function tryNoFor(sid, y, g, m, subj){
  return attempts.filter(a=>a.studentId===sid && a.year===y && a.examGrade===g
    && a.month===m && a.subject===subj).length + 1;
}
function rateOf(a){
  const total = a.total || (SUBJECTS[a.subject]?.q || 30);
  const wrong = (a.wrong||[]).length;
  return Math.round((total-wrong)/total*100);
}
function tagOf(key, q){ return (tags[key] && tags[key][q]) || ""; }

/* ═══════ 렌더 ═══════ */
function render(){
  const m = document.getElementById("main");
  if(!m) return;
  if(chart){ chart.destroy(); chart=null; }
  if(view==="add") return renderAdd(m);
  if(view==="detail") return renderDetail(m);
  if(tab==="mine") return renderMine(m);
  if(tab==="myana") return renderMyAna(m);
  if(tab==="all") return renderAll(m);
  if(tab==="ana") return renderAna(m);
  if(tab==="stu") return renderStu(m);
}

/* ── 학생: 내 기록 ── */
function renderMine(m){
  const list = myAttempts(me.id);
  let html = `<button class="btn" onclick="openAdd()">+ 새 연습 기록하기</button>`;
  if(!list.length){
    html += `<div class="card empty">아직 기록이 없다.<br>기출을 풀고 위 버튼으로 채점 결과를 남기면 된다.</div>`;
  }
  // 회차별 그룹 (반복 연습 비교)
  const groups = {};
  list.forEach(a=>{ const k=attemptKey(a); (groups[k]=groups[k]||[]).push(a); });
  Object.entries(groups).forEach(([k,arr])=>{
    arr.sort((a,b)=> a.tryNo-b.tryNo);
    const first = arr[0], last = arr[arr.length-1];
    const diff = arr.length>1 ? rateOf(last)-rateOf(first) : null;
    html += `<div class="card">
      <div class="rowline">
        <div style="flex:1">
          <div style="font-weight:800;font-size:15px">${esc(arr[0].subject)} · ${esc(examName(arr[0].year,arr[0].examGrade,arr[0].month))}</div>
          <div class="hint" style="margin-top:2px">${arr.length}회 연습</div>
        </div>
        ${diff!=null?`<span class="badge" style="background:${diff>=0?'rgba(47,157,118,.15)':'rgba(198,95,95,.15)'};color:${diff>=0?'#2f9d76':'#c65f5f'}">
          ${diff>=0?'+':''}${diff}%p</span>`:""}
      </div>
      ${arr.map(a=>`
        <div class="rowline" style="margin-top:10px;cursor:pointer" onclick="openDetail('${a.id}')">
          <div class="badge" style="background:#F1F5F9;color:#46586C">${a.tryNo}차</div>
          <div style="flex:1;font-size:12.5px;color:#8A99AB">${esc(a.date)}</div>
          <div style="font-size:13px;font-weight:700">틀린 ${(a.wrong||[]).length}개</div>
          <div style="font-weight:800;font-size:15px;color:${rateOf(a)>=90?'#2f9d76':(rateOf(a)>=70?'#b07f38':'#c65f5f')}">${rateOf(a)}%</div>
        </div>`).join("")}
    </div>`;
  });
  html += `<button class="btn-ghost" style="margin-top:6px" onclick="logout()">로그아웃</button>`;
  m.innerHTML = html;
}

/* ── 새 기록 입력 (매쓰플랫식) ── */
function openAdd(){
  ST = { year:thisYear-1, examGrade: (me&&me.grade==="중3")?"고1":(me?me.grade:"고2"),
           month:null, subject:"수학", wrong:[], date:today(), raw:"" };
  view="add"; render();
}
function renderAdd(m){
  const years=[]; for(let y=thisYear;y>=thisYear-6;y--) years.push(y);
  const qn = SUBJECTS[ST.subject]?.q || 30;
  const wrongN = ST.wrong.length;
  const rate = Math.round((qn-wrongN)/qn*100);
  const tryNo = ST.month ? tryNoFor((me?me.id:ST.studentId), ST.year, ST.examGrade, ST.month, ST.subject) : 1;

  m.innerHTML = `
  <button class="back" onclick="view='home';render()">‹ 돌아가기</button>
  ${isAdmin?`<div class="card">
    <label style="margin-top:0">학생</label>
    <select onchange="ST.studentId=this.value;render()">
      <option value="">— 학생 선택 —</option>
      ${students.map(s=>`<option value="${s.id}"${ST.studentId===s.id?" selected":""}>${esc(s.name)}</option>`).join("")}
    </select></div>`:""}

  <div class="card">
    <div class="sec">어떤 시험이었나</div>
    <label style="margin-top:4px">과목</label>
    <div class="pill-row">
      ${["수학","국어","영어","통합사회","통합과학"].map(s=>
        `<button class="pill${ST.subject===s?" on":""}" onclick="setSubj('${s}')">${s}</button>`).join("")}
    </div>
    <label>연도</label>
    <select onchange="ST.year=+this.value;render()">
      ${years.map(y=>`<option value="${y}"${y===ST.year?" selected":""}>${y}년</option>`).join("")}
    </select>
    <label>시험 학년</label>
    <div class="pill-row">
      ${EXAM_GRADES.map(g=>`<button class="pill${ST.examGrade===g?" on":""}" onclick="setEG('${g}')">${g}</button>`).join("")}
    </div>
    <label>회차</label>
    <div class="pill-row">
      ${EXAM_MONTHS[ST.examGrade].map(mm=>
        `<button class="pill${ST.month===mm?" on":""}" onclick="ST.month=${mm};render()">${monthLabel(ST.examGrade,mm)}</button>`).join("")}
    </div>
    ${ST.month?`<div style="background:#F1F5F9;border-radius:8px;padding:11px;margin-top:12px;text-align:center;font-weight:800;font-size:14px">
      ${esc(examName(ST.year,ST.examGrade,ST.month))} · ${esc(ST.subject)} <span style="color:#5F87AC">${tryNo}차 연습</span></div>`:
      `<div class="hint">회차를 고르면 몇 차 연습인지 자동으로 정해진다.</div>`}
    <label>푼 날짜</label>
    <input type="date" value="${ST.date}" onchange="ST.date=this.value">
  </div>

  <div class="card">
    <div class="sec">채점 — 틀린 번호를 누르면 된다</div>
    <div class="hint">처음엔 전부 정답(O) 상태다. 틀린 번호만 눌러 X로 바꾸면 된다.</div>
    <div class="qgrid">
      ${Array.from({length:qn},(_,i)=>i+1).map(q=>{
        const bad = ST.wrong.includes(q);
        return `<button class="q ${bad?'no':'ok'}" onclick="toggleQ(${q})">
          <span>${q}</span><span class="mark">${bad?'✕':'○'}</span></button>`;
      }).join("")}
    </div>
    <div class="summary">
      <div class="sbox"><span>맞은 개수</span><b style="color:#2f9d76">${qn-wrongN}</b></div>
      <div class="sbox"><span>틀린 개수</span><b style="color:#c65f5f">${wrongN}</b></div>
      <div class="sbox"><span>정답률</span><b>${rate}%</b></div>
    </div>
    <label>원점수 (선택)</label>
    <input type="number" inputmode="numeric" placeholder="배점 반영한 실제 점수" value="${ST.raw}"
      onchange="ST.raw=this.value">
    <div class="hint">모의고사는 문항마다 배점이 달라 정답률과 원점수가 다르다. 성적표 점수를 알면 적어두면 된다.</div>
  </div>

  <button class="btn" onclick="saveAttempt()">저장하기</button>`;
}
function setSubj(s){ ST.subject=s; ST.wrong=[]; render(); }
function setEG(g){ ST.examGrade=g; ST.month=null; render(); }
function toggleQ(q){
  const i = ST.wrong.indexOf(q);
  if(i<0) ST.wrong.push(q); else ST.wrong.splice(i,1);
  ST.wrong.sort((a,b)=>a-b);
  render();
}
function saveAttempt(){
  const sid = isAdmin ? ST.studentId : me.id;
  if(!sid) return toast("학생을 선택해야 한다");
  if(!ST.month) return toast("회차를 골라야 한다");
  const qn = SUBJECTS[ST.subject]?.q || 30;
  attempts.push({
    id: uid(), studentId: sid, subject: ST.subject,
    year: ST.year, examGrade: ST.examGrade, month: ST.month,
    tryNo: tryNoFor(sid, ST.year, ST.examGrade, ST.month, ST.subject),
    date: ST.date, total: qn, wrong: ST.wrong.slice(),
    raw: ST.raw, createdAt: Date.now()
  });
  persist(); view="home"; render();
  toast(`저장 완료 — 틀린 ${ST.wrong.length}개 기록됨`);
}

/* ── 기록 상세 (오답 유형 태그) ── */
function openDetail(id){ ST.detailId=id; view="detail"; render(); }
function renderDetail(m){
  const a = attempts.find(x=>x.id===ST.detailId);
  if(!a){ view="home"; return render(); }
  const st = students.find(s=>s.id===a.studentId);
  const key = attemptKey(a);
  const qn = a.total || 30;
  const wrong = a.wrong||[];
  const canEdit = isAdmin || (me && me.id===a.studentId);

  // 같은 회차 다른 차수와 비교
  const sibs = attempts.filter(x=>x.studentId===a.studentId && attemptKey(x)===key).sort((x,y)=>x.tryNo-y.tryNo);
  const prev = sibs.filter(x=>x.tryNo < a.tryNo).pop();
  const fixed = prev ? (prev.wrong||[]).filter(q=>!wrong.includes(q)) : [];
  const still = prev ? (prev.wrong||[]).filter(q=>wrong.includes(q)) : [];

  m.innerHTML = `
  <button class="back" onclick="view='home';render()">‹ 돌아가기</button>
  <div class="card">
    <div style="font-weight:800;font-size:16px">${esc(examName(a.year,a.examGrade,a.month))}</div>
    <div class="hint" style="margin-top:3px">
      ${esc(a.subject)} · ${a.tryNo}차 연습 · ${esc(a.date)}${st&&isAdmin?` · ${esc(st.name)}`:""}
    </div>
    <div class="summary">
      <div class="sbox"><span>맞은 개수</span><b style="color:#2f9d76">${qn-wrong.length}</b></div>
      <div class="sbox"><span>틀린 개수</span><b style="color:#c65f5f">${wrong.length}</b></div>
      <div class="sbox"><span>정답률</span><b>${rateOf(a)}%</b></div>
    </div>
    ${a.raw?`<div class="hint" style="text-align:right">원점수 ${esc(a.raw)}점</div>`:""}
  </div>

  ${prev?`<div class="card">
    <div class="sec">${prev.tryNo}차와 비교</div>
    ${fixed.length?`<div style="font-size:13px;margin-top:6px"><b style="color:#2f9d76">고친 문항</b> — ${fixed.join(", ")}번</div>`:""}
    ${still.length?`<div style="font-size:13px;margin-top:6px"><b style="color:#c65f5f">또 틀린 문항</b> — ${still.join(", ")}번</div>`:""}
    ${!fixed.length&&!still.length?`<div class="hint">겹치는 오답이 없다.</div>`:""}
  </div>`:""}

  <div class="card">
    <div class="sec">오답 ${wrong.length}문항 — 유형 적기</div>
    ${wrong.length?`
      <div class="hint">틀린 이유나 단원을 적어두면 나중에 무엇이 약한지 한눈에 보인다.</div>
      ${wrong.map(q=>`
        <div style="display:grid;grid-template-columns:50px 1fr;gap:8px;align-items:center;margin-top:8px">
          <div class="badge" style="background:rgba(198,95,95,.12);color:#c65f5f;text-align:center;padding:9px 0">${q}번</div>
          <input value="${esc(tagOf(key,q))}" placeholder="예: 수열, 계산실수, 시간부족"
            ${canEdit?`onchange="saveTag('${key}',${q},this.value)"`:"disabled"}>
        </div>`).join("")}
    `:`<div class="hint">틀린 문항이 없다.</div>`}
  </div>

  ${canEdit?`<button class="btn-ghost" onclick="delAttempt('${a.id}')" style="color:#c65f5f;border-color:#E8C7C4">이 기록 삭제</button>`:""}`;
}
function saveTag(key,q,v){
  if(!tags[key]) tags[key]={};
  const t=v.trim();
  if(t) tags[key][q]=t; else delete tags[key][q];
  persist(); toast("저장됨");
}
function delAttempt(id){
  if(!confirm("이 기록을 지울까?")) return;
  attempts = attempts.filter(a=>a.id!==id);
  persist(); view="home"; render();
}

/* ── 학생: 내 오답 ── */
function renderMyAna(m){ m.innerHTML = anaHtml(me.id); }
function anaHtml(sid){
  const list = attempts.filter(a=>a.studentId===sid);
  if(!list.length) return `<div class="card empty">아직 기록이 없다.</div>`;
  // 유형별 누적
  const tagFreq = {}, qFreq = {};
  list.forEach(a=>{
    const key = attemptKey(a);
    (a.wrong||[]).forEach(q=>{
      const t = tagOf(key,q);
      if(t) tagFreq[t]=(tagFreq[t]||0)+1;
      const label = `${a.subject} ${q}번`;
      qFreq[label]=(qFreq[label]||0)+1;
    });
  });
  const tagArr = Object.entries(tagFreq).map(([n,c])=>({n,c})).sort((a,b)=>b.c-a.c);
  const repeat = Object.entries(qFreq).map(([n,c])=>({n,c})).filter(x=>x.c>=2).sort((a,b)=>b.c-a.c);
  const bySubj = {};
  list.forEach(a=>{ (bySubj[a.subject]=bySubj[a.subject]||[]).push(a); });

  let h = `<div class="card">
    <div class="sec">과목별 정답률 흐름</div>
    ${Object.entries(bySubj).map(([s,arr])=>{
      arr.sort((x,y)=> x.date>y.date?1:-1);
      const first=rateOf(arr[0]), last=rateOf(arr[arr.length-1]);
      const d=last-first;
      return `<div class="bar-row">
        <div class="bar-label">${esc(s)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${last}%;background:${last>=90?'#2f9d76':(last>=70?'#b07f38':'#c65f5f')}"></div></div>
        <div class="bar-num">${last}%</div>
      </div>
      <div class="hint" style="margin-left:0">${arr.length}회 · 처음 ${first}% → 최근 ${last}% (${d>=0?'+':''}${d}%p)</div>`;
    }).join("")}
  </div>`;

  if(tagArr.length){
    const mx = tagArr[0].c;
    h += `<div class="card"><div class="sec">반복되는 오답 유형</div>
      ${tagArr.slice(0,8).map(t=>`<div class="bar-row">
        <div class="bar-label">${esc(t.n)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(t.c/mx*100)}%;background:#c65f5f"></div></div>
        <div class="bar-num">${t.c}회</div></div>`).join("")}
    </div>`;
  } else {
    h += `<div class="card"><div class="sec">반복되는 오답 유형</div>
      <div class="hint">기록을 열어 오답마다 유형을 적으면 여기에 모인다.</div></div>`;
  }

  if(repeat.length){
    h += `<div class="card"><div class="sec">두 번 이상 틀린 문항</div>
      <div style="font-size:13px;line-height:1.9;margin-top:4px">
        ${repeat.slice(0,15).map(r=>`<span class="badge" style="background:rgba(198,95,95,.12);color:#c65f5f;margin-right:5px">${esc(r.n)} · ${r.c}회</span>`).join("")}
      </div>
      <div class="hint">같은 문항을 반복해 틀린다면 개념이 아직 안 잡힌 것이다.</div>
    </div>`;
  }
  return h;
}

/* ── 교사: 전체 기록 ── */
function renderAll(m){
  let h = `<button class="btn" onclick="openAdd()">+ 대신 기록 입력</button>`;
  if(!attempts.length){ h += `<div class="card empty">아직 기록이 없다.</div>`; }
  students.forEach(s=>{
    const list = myAttempts(s.id);
    if(!list.length) return;
    const last = list[0];
    h += `<div class="card">
      <div class="rowline">
        <div style="flex:1">
          <div style="font-weight:800;font-size:15px">${esc(s.name)} <span style="font-weight:600;color:#8A99AB;font-size:12px">${esc(s.grade)}</span></div>
          <div class="hint" style="margin-top:2px">총 ${list.length}회 · 최근 ${esc(last.date)}</div>
        </div>
        <div style="font-weight:800;font-size:16px;color:${rateOf(last)>=90?'#2f9d76':(rateOf(last)>=70?'#b07f38':'#c65f5f')}">${rateOf(last)}%</div>
      </div>
      ${list.slice(0,4).map(a=>`
        <div class="rowline" style="margin-top:9px;cursor:pointer" onclick="openDetail('${a.id}')">
          <div class="badge" style="background:#F1F5F9;color:#46586C">${a.tryNo}차</div>
          <div style="flex:1;font-size:12.5px">${esc(a.subject)} · ${esc(examName(a.year,a.examGrade,a.month))}</div>
          <div style="font-size:13px;font-weight:700">${rateOf(a)}%</div>
        </div>`).join("")}
      ${list.length>4?`<div class="hint">외 ${list.length-4}건</div>`:""}
    </div>`;
  });
  h += `<button class="btn-ghost" onclick="logout()">로그아웃</button>`;
  m.innerHTML = h;
}

/* ── 교사: 오답 분석 ── */
function renderAna(m){
  const keys = [...new Set(attempts.map(attemptKey))];
  if(!keys.length){ m.innerHTML = `<div class="card empty">분석할 기록이 없다.</div>`; return; }
  if(!ST.anaKey || !keys.includes(ST.anaKey)) ST.anaKey = keys[0];
  const k = ST.anaKey;
  const [y,g,mo,subj] = k.split("_");
  const list = attempts.filter(a=>attemptKey(a)===k);
  const freq = {};
  list.forEach(a=>(a.wrong||[]).forEach(q=>freq[q]=(freq[q]||0)+1));
  const n = list.length;
  const sorted = Object.entries(freq).map(([q,c])=>({q:+q,c})).sort((a,b)=>b.c-a.c||a.q-b.q);
  const hot = sorted.filter(x=>x.c >= Math.max(2, Math.ceil(n*0.4)));
  const tagFreq={};
  sorted.forEach(x=>{ const t=tagOf(k,x.q); if(t) tagFreq[t]=(tagFreq[t]||0)+x.c; });
  const tagArr=Object.entries(tagFreq).map(([nm,c])=>({nm,c})).sort((a,b)=>b.c-a.c);

  let h = `<div class="card">
    <div class="sec">회차 선택</div>
    <select onchange="ST.anaKey=this.value;render()">
      ${keys.map(kk=>{const [yy,gg,mm,ss]=kk.split("_");
        return `<option value="${kk}"${kk===k?" selected":""}>${esc(ss)} · ${esc(examName(+yy,gg,+mm))}</option>`;}).join("")}
    </select>
    <div class="hint">응시(연습) ${n}건 기준</div>
  </div>
  <div class="card">
    <div class="sec">문항별 오답 빈도</div>
    <div style="line-height:2.1;margin-top:4px">
      ${sorted.slice(0,24).map(x=>{
        const r=x.c/n, col = r>=0.6?"#c65f5f":(r>=0.35?"#b07f38":"#8A99AB");
        return `<span class="badge" style="background:${col}1A;color:${col};border:1.4px solid ${col};margin-right:5px">${x.q}번 ${Math.round(r*100)}%</span>`;
      }).join("")}
    </div>
    ${hot.length?`<div style="margin-top:12px;font-size:13px;line-height:1.6">
      <b>집중 보강 대상</b> — ${hot.map(x=>x.q+"번").join(", ")}</div>`:`<div class="hint">과반이 틀린 문항은 없다.</div>`}
  </div>
  ${tagArr.length?`<div class="card"><div class="sec">유형별 누적 오답</div>
    ${tagArr.slice(0,8).map(t=>`<div class="bar-row">
      <div class="bar-label">${esc(t.nm)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(t.c/tagArr[0].c*100)}%;background:#c65f5f"></div></div>
      <div class="bar-num">${t.c}건</div></div>`).join("")}</div>`:""}`;
  m.innerHTML = h;
}

/* ── 교사: 학생·PIN 관리 ── */
function renderStu(m){
  let h = `<div class="card">
    <div class="sec">학생 PIN</div>
    <div class="hint">PIN은 학생에게 알려주면 된다. 칸을 고쳐 쓰면 바로 바뀐다.</div>
    <table class="pin">
      <tr><th>이름</th><th>학년</th><th>PIN</th><th></th></tr>
      ${students.map(s=>`<tr>
        <td style="font-weight:700">${esc(s.name)}</td>
        <td style="color:#8A99AB">${esc(s.grade)}</td>
        <td><input value="${esc(s.pin)}" maxlength="4" inputmode="numeric"
             onchange="setPin('${s.id}',this.value)"></td>
        <td><button class="x-btn" onclick="delStudent('${s.id}')">✕</button></td>
      </tr>`).join("")}
    </table>
  </div>
  <div class="card">
    <div class="sec">학생 추가</div>
    <label style="margin-top:4px">이름</label><input id="ns-name" placeholder="예: 박서준">
    <label>학년</label>
    <select id="ns-grade">
      ${["중3","고1","고2","고3"].map(g=>`<option value="${g}">${g}</option>`).join("")}
    </select>
    <label>학교 (선택)</label><input id="ns-school" placeholder="예: 동부중">
    <label>PIN (4자리)</label><input id="ns-pin" maxlength="4" inputmode="numeric" placeholder="예: 1106">
    <div style="margin-top:14px"><button class="btn" onclick="addStudent()">추가</button></div>
  </div>
  <button class="btn-ghost" onclick="logout()">로그아웃</button>`;
  m.innerHTML = h;
}
function setPin(id,v){
  const p = String(v).trim();
  if(!/^\d{4}$/.test(p)) return toast("PIN은 숫자 4자리여야 한다");
  if(p === ADMIN_PIN) return toast("선생님 PIN과 같게 둘 수 없다");
  if(students.some(s=>s.id!==id && String(s.pin)===p)) return toast("다른 학생과 겹친다");
  const s = students.find(x=>x.id===id); if(!s) return;
  s.pin = p; persist(); toast(`${s.name} PIN 변경됨`);
}
function addStudent(){
  const name=document.getElementById("ns-name").value.trim();
  const grade=document.getElementById("ns-grade").value;
  const school=document.getElementById("ns-school").value.trim();
  const pin=document.getElementById("ns-pin").value.trim();
  if(!name) return toast("이름을 넣어야 한다");
  if(!/^\d{4}$/.test(pin)) return toast("PIN은 숫자 4자리여야 한다");
  if(pin===ADMIN_PIN || students.some(s=>String(s.pin)===pin)) return toast("이미 쓰는 PIN이다");
  students.push({id:uid(), name, grade, school, pin});
  persist(); render(); toast(`${name} 추가됨`);
}
function delStudent(id){
  const s=students.find(x=>x.id===id); if(!s) return;
  const cnt = attempts.filter(a=>a.studentId===id).length;
  if(!confirm(`${s.name} 삭제. 연습 기록 ${cnt}건도 함께 지워진다. 진행할까?`)) return;
  students = students.filter(x=>x.id!==id);
  attempts = attempts.filter(a=>a.studentId!==id);
  persist(); render();
}

/* ═══════ 시작 ═══════ */
renderGate();
initFirebase(()=>{
  const savedMe = sessionStorage.getItem("mp_me");
  const savedAdmin = sessionStorage.getItem("mp_admin");
  if(savedAdmin==="1"){ isAdmin=true; enterApp(); }
  else if(savedMe){
    const s = students.find(x=>x.id===savedMe);
    if(s){ me=s; enterApp(); }
  }
});
</script>
