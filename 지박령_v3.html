<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title> index.html
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080f1c;--bg2:#0d1729;--bg3:#111f35;--bg4:#172540;
  --border:#1a3050;--border2:#243d5e;
  --text:#e4eeff;--text2:#8ba3c4;--text3:#4d6a8a;
  --blue:#3b82f6;--cyan:#06b6d4;--green:#10b981;
  --amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6;
  --r:14px;--r2:10px;--r3:7px;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── 화면 전환 ── */
.scr{display:none}.scr.on{display:block}

/* ── 공통 버튼 ── */
.btn{border:none;border-radius:var(--r2);padding:11px 16px;font:600 13px/1 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-blue{background:#3b82f6;color:#fff}.btn-blue:active{opacity:.85}
.btn-ghost{background:var(--bg3);border:1px solid var(--border2);color:var(--text2)}.btn-ghost:active{background:var(--bg4)}
.btn-green{background:#10b981;color:#fff}.btn-green:active{opacity:.85}
.btn-red{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.btn-full{width:100%}
.btn-lg{padding:14px 20px;font-size:15px}

/* ── 입력 ── */
.inp{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:12px 14px;color:var(--text);font:14px 'Noto Sans KR',sans-serif;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--blue)}
.inp::placeholder{color:var(--text3)}
.ta{resize:vertical;min-height:70px;line-height:1.6}
.err{color:var(--red);font-size:11px;margin-top:5px;min-height:15px}

/* ════════════════════════════════
   HOME
════════════════════════════════ */
#scrHome{background:var(--bg)}
.home-inner{max-width:500px;margin:0 auto;padding:40px 18px 60px}
.home-brand{margin-bottom:36px}
.home-brand .logo{font-size:32px;font-weight:900;letter-spacing:-1px;background:linear-gradient(120deg,#60a5fa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.home-brand .tagline{font-size:11px;color:var(--text3);letter-spacing:3px;margin-top:3px}

.home-admin-card{background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(139,92,246,.08));border:1px solid rgba(59,130,246,.25);border-radius:var(--r);padding:20px;margin-bottom:28px;cursor:pointer;transition:all .2s}
.home-admin-card:active{opacity:.85}
.home-admin-card .row{display:flex;align-items:center;justify-content:space-between}
.home-admin-card .title{font-size:16px;font-weight:700;color:var(--text)}
.home-admin-card .sub{font-size:11px;color:var(--text3);margin-top:4px}
.home-admin-card .arrow{font-size:20px;color:rgba(59,130,246,.6)}

.home-sec-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.stu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stu-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:14px 12px;cursor:pointer;text-align:center;transition:all .18s}
.stu-btn:active{background:var(--bg4);transform:scale(.97)}
.stu-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--border2);margin:0 auto 9px;transition:.2s}
.stu-btn.done .dot{background:var(--green);box-shadow:0 0 8px rgba(16,185,129,.5)}
.stu-btn .name{font-size:14px;font-weight:700;color:var(--text)}
.stu-btn .grade{font-size:10px;color:var(--text3);margin-top:2px}

/* ════════════════════════════════
   PIN OVERLAY
════════════════════════════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:900;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.overlay.on{display:flex}
.pin-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:28px 22px;width:100%;max-width:340px}
.pin-box .ptitle{font-size:16px;font-weight:700;margin-bottom:4px}
.pin-box .psub{font-size:12px;color:var(--text3);margin-bottom:20px}
.pin-btns{display:flex;gap:8px;margin-top:14px}
.pin-btns .btn{flex:1}

/* ════════════════════════════════
   APP HEADER
════════════════════════════════ */
.app-hd{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.hd-back{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;padding:0 8px 0 0;line-height:1;flex-shrink:0}
.hd-info{flex:1;min-width:0}
.hd-title{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-sub{font-size:9px;color:var(--text3)}
.hd-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--green);opacity:0;transition:opacity .3s}
.save-dot.show{opacity:1}

/* ── 탭 바 ── */
.tab-bar{background:var(--bg3);border-bottom:1px solid var(--border);padding:0 14px;display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:10px 14px;border:none;background:transparent;color:var(--text3);font:500 12px 'Noto Sans KR',sans-serif;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;flex-shrink:0}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}

/* ── 날짜 바 ── */
.date-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 10px;display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.dbt{padding:5px 10px;border-radius:var(--r3);border:1px solid var(--border);background:var(--bg3);color:var(--text3);font:11px 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;flex-shrink:0;white-space:nowrap}
.dbt.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.dbt.td{border-color:rgba(59,130,246,.5);color:var(--blue)}
.dbt.td.on{background:var(--blue);color:#fff}

/* ── 콘텐츠 영역 ── */
.ct{padding:14px 14px 80px}

/* ── 카드 ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.card-title{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}

/* ── 학생 행 (관리자용) ── */
.srow{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px}
.srow-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer}
.chk{width:20px;height:20px;border-radius:5px;border:2px solid var(--border2);background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;flex-shrink:0}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.srow-name{font-size:14px;font-weight:700;flex:1}
.srow-grade{font-size:10px;color:var(--text3)}
.badge{font-size:10px;padding:2px 8px;border-radius:20px}
.badge-done{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.badge-wip{background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.badge-none{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.srow-stats{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--bg4);color:var(--text3);border:1px solid var(--border)}

/* ── 요약 바 ── */
.sumbar{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.sumbar-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:10px 14px;flex-shrink:0;text-align:center;min-width:70px}
.sumbar-val{font-size:22px;font-weight:800;line-height:1}
.sumbar-lbl{font-size:9px;color:var(--text3);margin-top:3px}
.c-blue{color:var(--blue)}.c-green{color:var(--green)}.c-amber{color:var(--amber)}.c-red{color:var(--red)}.c-cyan{color:var(--cyan)}

/* ── 통계 박스 ── */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sg3{grid-template-columns:repeat(3,1fr)}
.sbox{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:12px}
.sbox-lbl{font-size:9px;color:var(--text3);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.sbox-val{font-size:22px;font-weight:800;line-height:1}
.sbox-val .unit{font-size:11px;font-weight:400;color:var(--text3);margin-left:2px}
.chg{font-size:10px;margin-top:3px}
.chg-up{color:var(--green)}.chg-dn{color:var(--red)}.chg-eq{color:var(--text3)}

/* ── 주간 바 차트 ── */
.wchart{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.wchart-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px}
.wbars{display:flex;align-items:flex-end;gap:5px;height:72px}
.wbar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.wbar{width:100%;border-radius:3px 3px 0 0;min-height:3px;transition:height .5s}
.wbar-today{background:linear-gradient(180deg,var(--blue),var(--cyan))}
.wbar-past{background:rgba(59,130,246,.3)}
.wbar-lbl{font-size:8px;color:var(--text3);text-align:center}
.wbar-val{font-size:8px;color:var(--text3);text-align:center}

/* ── 순위 바 차트 ── */
.rchart{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.rchart-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px}
.rbar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rbar-name{font-size:11px;color:var(--text2);width:50px;text-align:right;flex-shrink:0}
.rbar-track{flex:1;height:18px;background:var(--bg4);border-radius:3px;overflow:hidden}
.rbar-fill{height:100%;border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;font-size:8px;font-weight:700;color:rgba(255,255,255,.9);min-width:3px;transition:width .6s}
.rbar-me{background:linear-gradient(90deg,var(--blue),var(--cyan))}
.rbar-other{background:linear-gradient(90deg,rgba(139,92,246,.5),rgba(59,130,246,.35))}
.rrank{font-size:10px;color:var(--text3);width:20px;text-align:center}

/* ── 달력 ── */
.cal-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-title{font-size:14px;font-weight:700}
.cal-nav-btns{display:flex;gap:5px}
.mnbtn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r3);padding:5px 12px;color:var(--text2);font:600 11px 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s}
.mnbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-hd{font-size:9px;color:var(--text3);text-align:center;padding:3px 0;font-weight:600}
.cal-hd.sun{color:var(--red)}.cal-hd.sat{color:var(--blue)}
.cal-day{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:3px;min-height:40px;cursor:pointer;transition:all .15s}
.cal-day.td{border-color:var(--blue);background:rgba(59,130,246,.08)}
.cal-day.future{opacity:.3;cursor:default}
.cal-day .dn{font-size:9px;font-weight:600;text-align:center}
.cal-day.sun .dn{color:var(--red)}.cal-day.sat .dn{color:#60a5fa}
.cal-day .dh{font-size:8px;color:var(--cyan);text-align:center}
.caldot{width:4px;height:4px;border-radius:50%;margin:2px auto}
.caldot-done{background:var(--green)}.caldot-none{background:var(--border2)}

/* ── 오늘 지침 카드 ── */
.task-card{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(139,92,246,.06));border:1px solid rgba(59,130,246,.2);border-radius:var(--r);padding:20px;margin-bottom:12px}
.task-label{font-size:10px;color:var(--blue);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.task-text{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;margin-bottom:16px}
.task-empty{font-size:13px;color:var(--text3);text-align:center;padding:16px 0}
.done-btn{width:100%;padding:14px;border-radius:var(--r2);border:2px solid var(--blue);background:transparent;color:var(--blue);font:700 14px 'Noto Sans KR',sans-serif;cursor:pointer;transition:all .2s}
.done-btn.on{background:linear-gradient(135deg,var(--green),#059669);border-color:transparent;color:#fff;box-shadow:0 0 20px rgba(16,185,129,.25)}

/* ── 공부량 입력 ── */
.study-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.study-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.study-lbl{font-size:12px;color:var(--text2);width:72px;flex-shrink:0}
.study-inp{background:var(--bg);border:1px solid var(--border2);border-radius:var(--r3);padding:9px 10px;color:var(--text);font:13px 'Noto Sans KR',sans-serif;outline:none;flex:1}
.study-inp:focus{border-color:var(--blue)}
.study-unit{font-size:11px;color:var(--text3);width:28px}

/* ── 비교 토글 ── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;margin-bottom:10px}
.toggle-info .tl{font-size:12px;font-weight:600}
.toggle-info .ts{font-size:10px;color:var(--text3);margin-top:2px}
.sw{position:relative;width:44px;height:25px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .sl{position:absolute;inset:0;background:var(--bg4);border:1px solid var(--border2);border-radius:20px;cursor:pointer;transition:.25s}
.sw .sl::before{content:'';position:absolute;width:19px;height:19px;left:2px;top:2px;background:var(--text3);border-radius:50%;transition:.25s}
.sw input:checked+.sl{background:rgba(16,185,129,.2);border-color:var(--green)}
.sw input:checked+.sl::before{transform:translateX(19px);background:var(--green)}

/* ── 비교 테이블 ── */
.ctable{width:100%;border-collapse:collapse}
.ctable th{font-size:10px;color:var(--text3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-weight:600}
.ctable td{font-size:12px;padding:8px;border-bottom:1px solid rgba(26,48,80,.5);vertical-align:middle}
.ctable tr:hover td{background:rgba(59,130,246,.04)}
.rnk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700}
.rnk1{background:rgba(245,158,11,.2);color:var(--amber)}
.rnk2{background:rgba(148,163,184,.15);color:#94a3b8}
.rnk3{background:rgba(180,83,9,.15);color:#b45309}
.rnkn{background:var(--bg4);color:var(--text3)}

/* ── 피드백 ── */
.fb-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.fb-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:10px}
.fb-item{background:var(--bg4);border-radius:var(--r3);padding:10px;margin-bottom:6px;font-size:12px;line-height:1.6}
.fb-meta{font-size:10px;color:var(--text3);margin-top:3px}

/* ── 메모 ── */
.memo-ta{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r3);padding:10px;color:var(--text);font:12px/1.7 'Noto Sans KR',sans-serif;resize:vertical;outline:none}
.memo-ta:focus{border-color:var(--blue)}

/* ── 구분선 ── */
.divlbl{font-size:10px;color:var(--text3);font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 0 4px;border-bottom:1px solid var(--border);margin-bottom:10px}

/* ── 진행 바 ── */
.progbar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:8px}
.progfill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .5s}

/* ── FAB ── */
.fab{position:fixed;bottom:20px;right:16px;width:42px;height:42px;border-radius:50%;background:var(--blue);border:none;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:80;display:none;align-items:center;justify-content:center}
.fab.on{display:flex}

/* ── 빈 상태 ── */
.empty{text-align:center;padding:44px 20px;color:var(--text3)}
.empty .ei{font-size:30px;margin-bottom:10px}

/* ── 설정 ── */
.set-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(26,48,80,.5)}
.set-row:last-child{border-bottom:none}

@media(max-width:400px){.stu-grid{grid-template-columns:1fr 1fr}.sg3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- ████ HOME ████ -->
<div class="scr on" id="scrHome">
  <div class="home-inner">
    <div class="home-brand">
      <div class="logo">📚 지박령</div>
      <div class="tagline">지수학 공부관리 시스템</div>
    </div>

    <div class="home-admin-card" onclick="openPin('admin')">
      <div class="row">
        <div>
          <div class="title">👨‍🏫 선생님 대시보드</div>
          <div class="sub">관리자 전용 · PIN 인증</div>
        </div>
        <div class="arrow">›</div>
      </div>
    </div>

    <div class="home-sec-label">학생 로그인</div>
    <div class="stu-grid" id="homeGrid"></div>
  </div>
</div>

<!-- ████ PIN OVERLAY ████ -->
<div class="overlay" id="pinOverlay">
  <div class="pin-box">
    <div class="ptitle" id="pinTitle">PIN 입력</div>
    <div class="psub" id="pinSub">PIN을 입력하세요</div>
    <input class="inp" id="pinInp" type="password" placeholder="PIN" maxlength="10" onkeydown="if(event.key==='Enter')confirmPin()">
    <div class="err" id="pinErr"></div>
    <div class="pin-btns">
      <button class="btn btn-ghost" onclick="closePin()">취소</button>
      <button class="btn btn-blue" onclick="confirmPin()">확인</button>
    </div>
  </div>
</div>

<!-- ████ ADMIN ████ -->
<div class="scr" id="scrAdmin">
  <div class="app-hd">
    <button class="hd-back" onclick="goHome()">←</button>
    <div class="hd-info">
      <div class="hd-title">선생님 대시보드</div>
      <div class="hd-sub">지수학</div>
    </div>
    <div class="hd-right">
      <div class="save-dot" id="saveDot"></div>
      <div id="adminMonthBtns" style="display:flex;gap:4px"></div>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab on" onclick="aTab('daily',this)">📋 오늘</button>
    <button class="tab" onclick="aTab('monthly',this)">📅 월간</button>
    <button class="tab" onclick="aTab('stats',this)">📊 통계</button>
    <button class="tab" onclick="aTab('compare',this)">🏆 비교</button>
    <button class="tab" onclick="aTab('settings',this)">⚙️ 설정</button>
  </div>
  <div class="date-bar" id="adminDateBar"></div>
  <div class="ct" id="adminCt"></div>
  <div class="fab" id="fabAdmin" onclick="scrollTo({top:0,behavior:'smooth'})">↑</div>
</div>

<!-- ████ STUDENT ████ -->
<div class="scr" id="scrStudent">
  <div class="app-hd">
    <button class="hd-back" onclick="goHome()">←</button>
    <div class="hd-info">
      <div class="hd-title" id="stuHdTitle">-</div>
      <div class="hd-sub" id="stuHdSub">지수학</div>
    </div>
    <div class="hd-right">
      <div class="save-dot" id="saveDotStu"></div>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab on" onclick="sTab('today',this)">📋 오늘</button>
    <button class="tab" onclick="sTab('stats',this)">📈 통계</button>
    <button class="tab" onclick="sTab('monthly',this)">📅 기록</button>
    <button class="tab" onclick="sTab('compare',this)" id="stuCmpTab">🏆 비교</button>
    <button class="tab" onclick="sTab('memo',this)">📝 메모</button>
  </div>
  <div class="ct" id="stuCt"></div>
</div>

<script>
// ═══════════════════════════════════════════
//  상수
// ═══════════════════════════════════════════
const ADMIN_PIN = "0604";
const KEY = "jibak_v3";

const STUDENTS = [
  {name:"김하은",  grade:"11년생"},
  {name:"윤건후",  grade:"11년생"},
  {name:"오윤아",  grade:"11년생"},
  {name:"강나율",  grade:"11년생"},
  {name:"최아인",  grade:"11년생"},
  {name:"전지우",  grade:"11년생"},
  {name:"윤선후",  grade:"09년생"},
  {name:"이민혁",  grade:"09년생"},
  {name:"황윤성",  grade:"기타"},
  {name:"임하영",  grade:"기타"},
  {name:"김소율",  grade:"기타"},
];

const MONTHS = [
  {y:2026,m:5,label:"5월",days:31,key:"m05"},
  {y:2026,m:6,label:"6월",days:30,key:"m06"},
  {y:2026,m:7,label:"7월",days:31,key:"m07"},
  {y:2026,m:8,label:"8월",days:31,key:"m08"},
  {y:2026,m:9,label:"9월",days:30,key:"m09"},
  {y:2026,m:10,label:"10월",days:31,key:"m10"},
  {y:2026,m:11,label:"11월",days:30,key:"m11"},
  {y:2026,m:12,label:"12월",days:31,key:"m12"},
];
const DK = ["일","월","화","수","목","금","토"];

// ── KST 오늘 ──
const _now = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
const TODAY = {y:_now.getFullYear(), m:_now.getMonth()+1, d:_now.getDate(), dow:DK[_now.getDay()]};

// ═══════════════════════════════════════════
//  데이터
// ═══════════════════════════════════════════
let DB = {};
let curStudent = null;
let adminView = 'daily';
let stuView = 'today';
let curAdminMk = null;
let curAdminDk = null;
let curStuMk = null;

function load() {
  try { DB = JSON.parse(localStorage.getItem(KEY)||"{}"); } catch { DB={}; }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(DB));
  // 저장 표시
  ['saveDot','saveDotStu'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t=setTimeout(()=>el.classList.remove('show'),1200);
  });
}

function ep(...keys) {
  let o=DB;
  for(const k of keys){ if(!o[k])o[k]={}; o=o[k]; }
  return o;
}

function todayKey() { return "d"+String(TODAY.d).padStart(2,"0"); }

function getMonthCfg(key) { return MONTHS.find(x=>x.key===key)||MONTHS[0]; }

function curMonthKey() {
  const f=MONTHS.find(x=>x.m===TODAY.m&&x.y===TODAY.y);
  return f?f.key:MONTHS[0].key;
}

function defStu() { return {done:false,task:"",hours:0,pages:0,note:""}; }

function getDayData(mk,dk) {
  const d=ep(mk,dk);
  if(!d.students) d.students={};
  STUDENTS.forEach(s=>{ if(!d.students[s.name]) d.students[s.name]=defStu(); });
  return d;
}

function getStuData(mk,dk,name) {
  const d=getDayData(mk,dk);
  if(!d.students[name]) d.students[name]=defStu();
  return d.students[name];
}

// 학생 전체 통계
function calcStats(name) {
  const st={totalHours:0,totalPages:0,doneDays:0,streak:0,weekHours:Array(7).fill(0),monthMap:{}};
  MONTHS.forEach(mc=>{
    const md=DB[mc.key]; if(!md) return;
    for(let d=1;d<=mc.days;d++){
      const dk="d"+String(d).padStart(2,"0");
      const day=md[dk]; if(!day||!day.students||!day.students[name]) continue;
      const sd=day.students[name];
      const h=parseFloat(sd.hours||sd.studyHours||0)||0;
      const p=parseInt(sd.pages||sd.studyPages||0)||0;
      st.totalHours+=h; st.totalPages+=p;
      if(sd.done) st.doneDays++;
      const dkey=`${mc.y}-${String(mc.m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      st.monthMap[dkey]={h,p,done:sd.done};
    }
  });
  // 최근 7일
  for(let i=0;i<7;i++){
    const dt=new Date(_now); dt.setDate(dt.getDate()-i);
    const dk=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
    st.weekHours[6-i]=(st.monthMap[dk]||{}).h||0;
  }
  // 스트릭
  for(let i=0;i<60;i++){
    const dt=new Date(_now); dt.setDate(dt.getDate()-i);
    const dk=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
    if((st.monthMap[dk]||{}).done) st.streak++; else break;
  }
  const todayFull=`${TODAY.y}-${String(TODAY.m).padStart(2,"0")}-${String(TODAY.d).padStart(2,"0")}`;
  const yesterFull=(()=>{const dt=new Date(_now);dt.setDate(dt.getDate()-1);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;})();
  const lwFull=(()=>{const dt=new Date(_now);dt.setDate(dt.getDate()-7);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;})();
  st.todayH=(st.monthMap[todayFull]||{}).h||0;
  st.yesterH=(st.monthMap[yesterFull]||{}).h||0;
  st.lwH=(st.monthMap[lwFull]||{}).h||0;
  return st;
}

function getTodayRank() {
  const mk=MONTHS.find(x=>x.m===TODAY.m&&x.y===TODAY.y);
  if(!mk) return [];
  const dk=todayKey();
  return STUDENTS.map(s=>{
    const sd=getStuData(mk.key,dk,s.name);
    return {name:s.name,hours:parseFloat(sd.hours||sd.studyHours||0)||0,pages:parseInt(sd.pages||sd.studyPages||0)||0,done:sd.done};
  }).sort((a,b)=>b.hours-a.hours||b.pages-a.pages);
}

function isCompareOn() { return !!(DB.settings&&DB.settings.compareOpen); }

// ═══════════════════════════════════════════
//  화면 전환
// ═══════════════════════════════════════════
function showScr(id) {
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  scrollTo(0,0);
}

function goHome() {
  curStudent=null;
  buildHomeGrid();
  showScr('scrHome');
}

function buildHomeGrid() {
  const mk=MONTHS.find(x=>x.m===TODAY.m&&x.y===TODAY.y);
  const dk=todayKey();
  document.getElementById('homeGrid').innerHTML=STUDENTS.map(s=>{
    let done=false;
    if(mk){ const sd=((DB[mk.key]||{})[dk]||{}).students||{}; done=!!(sd[s.name]||{}).done; }
    return `<div class="stu-btn ${done?'done':''}" onclick="openPin('stu','${s.name}')">
      <div class="dot"></div>
      <div class="name">${s.name}</div>
      <div class="grade">${s.grade}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════
//  PIN
// ═══════════════════════════════════════════
let _pinMode='', _pinName='';

function openPin(mode, name='') {
  _pinMode=mode; _pinName=name;
  const ov=document.getElementById('pinOverlay');
  const title=document.getElementById('pinTitle');
  const sub=document.getElementById('pinSub');
  const inp=document.getElementById('pinInp');
  const err=document.getElementById('pinErr');
  if(mode==='admin'){
    title.textContent='🔐 관리자 로그인';
    sub.textContent='선생님 PIN을 입력하세요';
  } else {
    title.textContent=`🙋 ${name}`;
    sub.innerHTML='개인 PIN을 입력하세요<br><span style="font-size:10px;color:var(--text3)">처음이면 새 PIN으로 등록됩니다</span>';
  }
  inp.value=''; err.textContent='';
  inp.type='password';
  ov.classList.add('on');
  setTimeout(()=>inp.focus(),150);
}

function closePin() {
  document.getElementById('pinOverlay').classList.remove('on');
}

function confirmPin() {
  const v=document.getElementById('pinInp').value;
  const err=document.getElementById('pinErr');
  if(!v||v.length<2){ err.textContent='PIN을 입력하세요'; return; }
  if(_pinMode==='admin'){
    if(v===ADMIN_PIN){ closePin(); openAdmin(); }
    else { err.textContent='PIN이 틀렸습니다'; document.getElementById('pinInp').value=''; }
  } else {
    const stored=(DB.pins||{})[_pinName];
    if(!stored){
      ep('pins')[_pinName]=v; save();
      closePin(); openStudent(_pinName);
    } else if(stored===v){
      closePin(); openStudent(_pinName);
    } else {
      err.textContent='PIN이 틀렸습니다'; document.getElementById('pinInp').value='';
    }
  }
}

// ═══════════════════════════════════════════
//  ADMIN
// ═══════════════════════════════════════════
function openAdmin() {
  curAdminMk=curMonthKey();
  curAdminDk=todayKey();
  adminView='daily';
  buildAdminMonthBtns();
  document.querySelectorAll('#scrAdmin .tab').forEach((t,i)=>{t.classList.toggle('on',i===0);});
  showScr('scrAdmin');
  renderAdmin();
}

function buildAdminMonthBtns() {
  const cur=MONTHS.findIndex(x=>x.key===curAdminMk);
  const show=MONTHS.slice(Math.max(0,cur-1),cur+3);
  document.getElementById('adminMonthBtns').innerHTML=show.map(mc=>
    `<button class="mnbtn ${mc.key===curAdminMk?'on':''}" onclick="curAdminMk='${mc.key}';curAdminDk=todayKey();buildAdminMonthBtns();renderAdmin()">${mc.label}</button>`
  ).join('');
}

function aTab(v,el) {
  adminView=v;
  document.querySelectorAll('#scrAdmin .tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  renderAdmin();
}

function renderAdmin() {
  const mc=getMonthCfg(curAdminMk);
  const dateBar=document.getElementById('adminDateBar');
  if(adminView==='daily'){
    dateBar.style.display='flex';
    buildAdminDateBar(mc);
  } else {
    dateBar.style.display='none';
  }
  const ct=document.getElementById('adminCt');
  if(adminView==='daily') renderAdminDaily(ct,mc);
  else if(adminView==='monthly') renderAdminMonthly(ct,mc);
  else if(adminView==='stats') renderAdminStats(ct);
  else if(adminView==='compare') renderAdminCompare(ct);
  else if(adminView==='settings') renderAdminSettings(ct);
}

function buildAdminDateBar(mc) {
  let h=`<button class="dbt td" onclick="curAdminDk=todayKey();renderAdmin()">📍오늘</button>`;
  for(let d=1;d<=mc.days;d++){
    const dt=new Date(mc.y,mc.m-1,d);
    const dow=DK[dt.getDay()];
    const dk="d"+String(d).padStart(2,"0");
    const isToday=mc.m===TODAY.m&&mc.y===TODAY.y&&d===TODAY.d;
    h+=`<button class="dbt ${curAdminDk===dk?'on':''} ${isToday&&curAdminDk!==dk?'td':''}"
      style="${dow==='일'&&curAdminDk!==dk?'color:var(--red)':''}"
      onclick="curAdminDk='${dk}';renderAdmin()">${d}(${dow})${isToday?' ◀':''}</button>`;
  }
  document.getElementById('adminDateBar').innerHTML=h;
  setTimeout(()=>{const a=document.querySelector('.dbt.on');if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});},80);
}

function renderAdminDaily(ct,mc) {
  const dk=curAdminDk;
  const day=getDayData(mc.key,dk);
  const d=parseInt(dk.replace("d",""));
  const dt=new Date(mc.y,mc.m-1,d);
  const dow=DK[dt.getDay()];
  const isToday=mc.m===TODAY.m&&mc.y===TODAY.y&&d===TODAY.d;
  const total=STUDENTS.length;
  const doneN=STUDENTS.filter(s=>(day.students[s.name]||{}).done).length;
  const pct=Math.round(doneN/total*100);

  // 요약 카드
  let h=`<div class="card">
    <div style="font-size:15px;font-weight:800">${mc.m}월 ${d}일 (${dow})${isToday?' <span style="font-size:10px;background:rgba(59,130,246,.15);color:var(--blue);padding:2px 8px;border-radius:20px;vertical-align:middle">오늘</span>':''}</div>
    <div style="font-size:11px;color:var(--text3);margin-top:3px">${doneN}/${total}명 완료 · ${pct}%</div>
    <div class="progbar"><div class="progfill" style="width:${pct}%"></div></div>
  </div>`;

  // 공통 지침
  h+=`<div class="card">
    <div class="card-title">📢 공통 지침 <span style="font-weight:400;font-size:10px">(미입력시 학생별 지침 적용)</span></div>
    <textarea class="inp ta" placeholder="전체 공통 지침..." onchange="ep('${mc.key}','${dk}').commonTask=this.value;save()">${day.commonTask||''}</textarea>
  </div>`;

  // 요약 숫자
  const sumHours=STUDENTS.reduce((a,s)=>a+(parseFloat((day.students[s.name]||{}).hours||0)||0),0);
  h+=`<div class="sumbar">
    <div class="sumbar-item"><div class="sumbar-val c-green">${doneN}</div><div class="sumbar-lbl">완료</div></div>
    <div class="sumbar-item"><div class="sumbar-val c-amber">${total-doneN}</div><div class="sumbar-lbl">미완료</div></div>
    <div class="sumbar-item"><div class="sumbar-val c-blue">${sumHours.toFixed(1)}</div><div class="sumbar-lbl">총시간</div></div>
    <div class="sumbar-item"><div class="sumbar-val c-cyan">${(sumHours/total).toFixed(1)}</div><div class="sumbar-lbl">평균</div></div>
  </div>`;

  h+=`<div class="divlbl">개인별 현황</div>`;

  STUDENTS.forEach(s=>{
    const sd=day.students[s.name]||defStu();
    h+=`<div class="srow">
      <div class="srow-hd" onclick="toggleDoneAdmin('${mc.key}','${dk}','${s.name}')">
        <div class="chk ${sd.done?'on':''}">${sd.done?'✓':''}</div>
        <div class="srow-name">${s.name}</div>
        <span class="badge ${sd.done?'badge-done':sd.task?'badge-wip':'badge-none'}">${sd.done?'완료':sd.task?'진행중':'대기'}</span>
        <div class="srow-grade">${s.grade}</div>
      </div>
      <textarea class="inp ta" style="min-height:52px" placeholder="개인 지침 (없으면 공통 지침 표시)..."
        onchange="getStuData('${mc.key}','${dk}','${s.name}').task=this.value;save();renderAdmin()">${sd.task||''}</textarea>
      <div class="srow-stats">
        <span class="chip">⏱ ${parseFloat(sd.hours||sd.studyHours||0).toFixed(1)}h</span>
        <span class="chip">📄 ${parseInt(sd.pages||sd.studyPages||0)}P</span>
        ${sd.note?`<span class="chip">✏️ ${sd.note.slice(0,12)}${sd.note.length>12?'…':''}</span>`:''}
      </div>
    </div>`;
  });

  ct.innerHTML=h;
}

function toggleDoneAdmin(mk,dk,name) {
  const sd=getStuData(mk,dk,name);
  sd.done=!sd.done;
  if(sd.done) sd.doneTime=new Date().toISOString();
  save();
  renderAdmin();
  buildHomeGrid();
}

function renderAdminMonthly(ct,mc) {
  let h=`<div class="cal-wrap">
    <div class="cal-nav">
      <div class="cal-nav-title">${mc.label} 전체 현황</div>
      <div class="cal-nav-btns">${MONTHS.slice(0,8).map(m=>`<button class="mnbtn ${m.key===curAdminMk?'on':''}" onclick="curAdminMk='${m.key}';curAdminDk=todayKey();buildAdminMonthBtns();renderAdmin()">${m.label}</button>`).join('')}</div>
    </div>
    <div class="cal-grid">
      ${DK.map((d,i)=>`<div class="cal-hd ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('')}`;

  const firstDow=new Date(mc.y,mc.m-1,1).getDay();
  for(let i=0;i<firstDow;i++) h+=`<div></div>`;
  for(let d=1;d<=mc.days;d++){
    const dt=new Date(mc.y,mc.m-1,d);
    const dow=dt.getDay();
    const dk="d"+String(d).padStart(2,"0");
    const day=(DB[mc.key]||{})[dk]||{};
    const stu=day.students||{};
    const doneN=STUDENTS.filter(s=>(stu[s.name]||{}).done).length;
    const isToday=mc.m===TODAY.m&&mc.y===TODAY.y&&d===TODAY.d;
    const isFuture=mc.y>TODAY.y||(mc.y===TODAY.y&&(mc.m>TODAY.m||(mc.m===TODAY.m&&d>TODAY.d)));
    h+=`<div class="cal-day ${isToday?'td':''} ${isFuture?'future':''} ${dow===0?'sun':dow===6?'sat':''}"
      onclick="${isFuture?'':`curAdminDk='${dk}';aTab('daily',document.querySelectorAll('#scrAdmin .tab')[0])`}">
      <div class="dn">${d}</div>
      ${doneN>0?`<div class="caldot caldot-done"></div>`:(isFuture?'':`<div class="caldot caldot-none"></div>`)}
    </div>`;
  }
  h+=`</div></div>`;
  ct.innerHTML=h;
}

function renderAdminStats(ct) {
  const allS=STUDENTS.map(s=>({name:s.name,...calcStats(s.name)}));
  const maxH=Math.max(...allS.map(s=>s.totalHours),0.1);
  const maxD=Math.max(...allS.map(s=>s.doneDays),1);

  let h=`<div class="rchart">
    <div class="rchart-title">📊 누적 공부시간 랭킹</div>
    ${allS.sort((a,b)=>b.totalHours-a.totalHours).map((s,i)=>`
      <div class="rbar-row">
        <div class="rbar-name">${s.name}</div>
        <div class="rbar-track">
          <div class="rbar-fill rbar-other" style="width:${Math.max(s.totalHours/maxH*100,1)}%">${s.totalHours.toFixed(1)}h</div>
        </div>
        <div class="rrank">${i+1}</div>
      </div>`).join('')}
  </div>
  <div class="rchart">
    <div class="rchart-title">✅ 완료일 수 · 🔥 연속기록</div>
    ${allS.sort((a,b)=>b.doneDays-a.doneDays).map(s=>`
      <div class="rbar-row">
        <div class="rbar-name">${s.name}</div>
        <div class="rbar-track">
          <div class="rbar-fill rbar-me" style="width:${Math.max(s.doneDays/maxD*100,1)}%">${s.doneDays}일</div>
        </div>
        <div class="rrank" style="color:var(--amber)">${s.streak}🔥</div>
      </div>`).join('')}
  </div>`;
  ct.innerHTML=h;
}

function renderAdminCompare(ct) {
  const isOn=isCompareOn();
  const rank=getTodayRank();
  let h=`<div class="toggle-row">
    <div class="toggle-info"><div class="tl">🏆 학생간 비교 공개</div><div class="ts">켜면 학생 앱에서 타인과 비교 가능</div></div>
    <label class="sw"><input type="checkbox" ${isOn?'checked':''} onchange="ep('settings').compareOpen=this.checked;save()"><span class="sl"></span></label>
  </div>
  <div class="card">
    <div class="card-title">오늘 공부량 (관리자 전용)</div>
    <table class="ctable">
      <tr><th>순위</th><th>학생</th><th>시간</th><th>페이지</th><th>완료</th></tr>
      ${rank.map((s,i)=>`<tr>
        <td><span class="rnk ${i===0?'rnk1':i===1?'rnk2':i===2?'rnk3':'rnkn'}">${i+1}</span></td>
        <td style="font-weight:700">${s.name}</td>
        <td style="color:var(--blue);font-weight:600">${s.hours.toFixed(1)}h</td>
        <td style="color:var(--cyan)">${s.pages}P</td>
        <td>${s.done?'<span style="color:var(--green)">✓</span>':'-'}</td>
      </tr>`).join('')}
    </table>
  </div>`;
  ct.innerHTML=h;
}

function renderAdminSettings(ct) {
  const pins=DB.pins||{};
  let h=`<div class="card">
    <div class="card-title">학생 PIN 관리</div>
    ${STUDENTS.map(s=>`<div class="set-row">
      <div style="font-size:13px;font-weight:600;flex:1">${s.name}</div>
      <div style="font-size:11px;color:${pins[s.name]?'var(--green)':'var(--text3)'}">${pins[s.name]?'등록됨':'없음'}</div>
      ${pins[s.name]?`<button class="btn btn-red" style="padding:5px 10px;font-size:11px;margin-left:8px" onclick="resetPin('${s.name}')">초기화</button>`:''}
    </div>`).join('')}
  </div>
  <div class="card">
    <div class="card-title">📦 데이터 백업 / 복원</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="backupData()">💾 백업 다운로드</button>
      <label class="btn btn-ghost" style="cursor:pointer">📂 복원 불러오기<input type="file" accept=".json" style="display:none" onchange="restoreData(event)"></label>
    </div>
    <div style="font-size:11px;color:var(--text3);margin-top:8px">같은 기기·같은 브라우저에서 자동 저장됩니다. 다른 기기로 옮길 때 백업을 사용하세요.</div>
  </div>`;
  ct.innerHTML=h;
}

function resetPin(name) {
  if(!confirm(`${name}의 PIN을 초기화할까요?`)) return;
  delete ep('pins')[name];
  save();
  renderAdmin();
}

function backupData() {
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`지박령_백업_${TODAY.y}${String(TODAY.m).padStart(2,"0")}${String(TODAY.d).padStart(2,"0")}.json`;
  a.click();
}

function restoreData(e) {
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      DB=JSON.parse(ev.target.result);
      save();
      alert('복원 완료!');
      renderAdmin();
    }catch{ alert('파일 오류'); }
  };
  r.readAsText(file,'UTF-8');
  e.target.value='';
}

// ═══════════════════════════════════════════
//  STUDENT
// ═══════════════════════════════════════════
function openStudent(name) {
  curStudent=name;
  curStuMk=curMonthKey();
  stuView='today';
  document.getElementById('stuHdTitle').textContent=name;
  document.getElementById('stuHdSub').textContent=(STUDENTS.find(s=>s.name===name)||{}).grade||'지수학';
  document.getElementById('stuCmpTab').style.display=isCompareOn()?'':'none';
  document.querySelectorAll('#scrStudent .tab').forEach((t,i)=>t.classList.toggle('on',i===0));
  showScr('scrStudent');
  renderStudent();
}

function sTab(v,el) {
  stuView=v;
  document.querySelectorAll('#scrStudent .tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  renderStudent();
}

function renderStudent() {
  const ct=document.getElementById('stuCt');
  const mc=getMonthCfg(curStuMk);
  if(stuView==='today') renderStuToday(ct,mc);
  else if(stuView==='stats') renderStuStats(ct);
  else if(stuView==='monthly') renderStuMonthly(ct,mc);
  else if(stuView==='compare') renderStuCompare(ct);
  else if(stuView==='memo') renderStuMemo(ct);
}

function renderStuToday(ct,mc) {
  const dk=todayKey();
  const day=getDayData(mc.key,dk);
  const sd=getStuData(mc.key,dk,curStudent);
  const taskText=sd.task||day.commonTask||'';
  const feedbacks=Object.entries(ep('feedback',curStudent)).sort((a,b)=>b[0].localeCompare(a[0]));
  const st=calcStats(curStudent);
  const chgY=st.yesterH>0?((st.todayH-st.yesterH)/st.yesterH*100).toFixed(0):null;
  const chgLW=st.lwH>0?((st.todayH-st.lwH)/st.lwH*100).toFixed(0):null;

  let h=`<div class="task-card">
    <div class="task-label">📋 오늘의 지침 · ${TODAY.m}/${TODAY.d}(${TODAY.dow})</div>
    ${taskText?`<div class="task-text">${taskText}</div>`:`<div class="task-empty">📭 아직 지침이 없어요<br><span style="font-size:11px">선생님이 입력하면 표시됩니다</span></div>`}
    <button class="done-btn ${sd.done?'on':''}" onclick="toggleDoneStu()">
      ${sd.done?'✅ 완료했어요! (취소하려면 다시 클릭)':'⬜ 완료하기'}
    </button>
  </div>`;

  h+=`<div class="study-wrap">
    <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:10px">⏱ 오늘 공부량 기록</div>
    <div class="study-row">
      <div class="study-lbl">공부 시간</div>
      <input class="study-inp" type="number" step="0.5" min="0" placeholder="0.0"
        value="${parseFloat(sd.hours||sd.studyHours||0)||''}"
        onchange="setStuStudy('hours',this.value)">
      <div class="study-unit">시간</div>
    </div>
    <div class="study-row">
      <div class="study-lbl">문제 페이지</div>
      <input class="study-inp" type="number" min="0" placeholder="0"
        value="${parseInt(sd.pages||sd.studyPages||0)||''}"
        onchange="setStuStudy('pages',this.value)">
      <div class="study-unit">P</div>
    </div>
  </div>`;

  h+=`<div class="sg sg3">
    <div class="sbox">
      <div class="sbox-lbl">오늘</div>
      <div class="sbox-val c-blue">${st.todayH.toFixed(1)}<span class="unit">h</span></div>
    </div>
    <div class="sbox">
      <div class="sbox-lbl">어제比</div>
      <div class="sbox-val ${chgY===null?'':+chgY>=0?'c-green':'c-red'}">${chgY===null?'-':((+chgY>=0?'+':'')+chgY+'%')}</div>
      <div class="chg chg-eq">${st.yesterH.toFixed(1)}→${st.todayH.toFixed(1)}h</div>
    </div>
    <div class="sbox">
      <div class="sbox-lbl">전주比</div>
      <div class="sbox-val ${chgLW===null?'':+chgLW>=0?'c-green':'c-red'}">${chgLW===null?'-':((+chgLW>=0?'+':'')+chgLW+'%')}</div>
      <div class="chg chg-eq">${st.lwH.toFixed(1)}→${st.todayH.toFixed(1)}h</div>
    </div>
  </div>`;

  if(feedbacks.length){
    const [fk,fv]=feedbacks[0];
    h+=`<div class="fb-wrap">
      <div class="fb-title">💬 선생님 피드백</div>
      <div class="fb-item">${fv.text||fv}<div class="fb-meta">${fk.replace(/_/g,'-')}</div></div>
      ${feedbacks.length>1?`<div style="font-size:10px;color:var(--blue);text-align:right;cursor:pointer;margin-top:4px" onclick="sTab('memo',document.querySelectorAll('#scrStudent .tab')[4])">+${feedbacks.length-1}개 더보기</div>`:''}
    </div>`;
  }
  ct.innerHTML=h;
}

function setStuStudy(type,val) {
  const mc=getMonthCfg(curStuMk);
  const sd=getStuData(mc.key,todayKey(),curStudent);
  if(type==='hours') sd.hours=parseFloat(val)||0;
  else sd.pages=parseInt(val)||0;
  save();
  if(stuView==='today') renderStudent();
}

function toggleDoneStu() {
  const mc=getMonthCfg(curStuMk);
  const sd=getStuData(mc.key,todayKey(),curStudent);
  sd.done=!sd.done;
  if(sd.done) sd.doneTime=new Date().toISOString();
  save();
  renderStudent();
  buildHomeGrid();
}

function renderStuStats(ct) {
  const st=calcStats(curStudent);
  const maxW=Math.max(...st.weekHours,0.1);
  const weekDays=[];
  for(let i=6;i>=0;i--){const dt=new Date(_now);dt.setDate(dt.getDate()-i);weekDays.push(DK[dt.getDay()]);}
  const chgY=st.yesterH>0?((st.todayH-st.yesterH)/st.yesterH*100).toFixed(0):null;
  const chgLW=st.lwH>0?((st.todayH-st.lwH)/st.lwH*100).toFixed(0):null;

  let h=`<div class="sg">
    <div class="sbox"><div class="sbox-lbl">총 공부시간</div><div class="sbox-val c-blue">${st.totalHours.toFixed(1)}<span class="unit">h</span></div></div>
    <div class="sbox"><div class="sbox-lbl">총 페이지</div><div class="sbox-val c-cyan">${st.totalPages}<span class="unit">P</span></div></div>
    <div class="sbox"><div class="sbox-lbl">완료한 날</div><div class="sbox-val c-green">${st.doneDays}<span class="unit">일</span></div></div>
    <div class="sbox"><div class="sbox-lbl">연속 완료</div><div class="sbox-val c-amber">${st.streak}<span class="unit">🔥</span></div></div>
  </div>`;

  h+=`<div class="wchart">
    <div class="wchart-title">📈 최근 7일 공부 시간</div>
    <div class="wbars">
      ${st.weekHours.map((h2,i)=>{
        const isT=i===6;
        const pct=maxW>0?Math.max(h2/maxW*100,3):3;
        return `<div class="wbar-wrap">
          <div class="wbar ${isT?'wbar-today':'wbar-past'}" style="height:${pct}%"></div>
          <div class="wbar-lbl">${weekDays[i]}</div>
          <div class="wbar-val">${h2>0?h2.toFixed(1):'-'}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  h+=`<div class="sg">
    <div class="sbox" style="grid-column:1/-1">
      <div class="sbox-lbl">오늘 vs 어제 / 전주 동요일</div>
      <div style="display:flex;gap:20px;margin-top:8px;flex-wrap:wrap">
        <div><div style="font-size:28px;font-weight:900;color:var(--blue)">${st.todayH.toFixed(1)}<span style="font-size:13px;color:var(--text3);font-weight:400">h</span></div><div style="font-size:10px;color:var(--text3)">오늘</div></div>
        <div>
          <div style="font-size:12px;color:var(--text3)">어제 ${st.yesterH.toFixed(1)}h 대비</div>
          <div style="font-size:20px;font-weight:800;color:${chgY===null?'var(--text3)':+chgY>=0?'var(--green)':'var(--red)'}">${chgY===null?'기록없음':((+chgY>=0?'+':'')+chgY+'%')}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:8px">전주 동요일 ${st.lwH.toFixed(1)}h 대비</div>
          <div style="font-size:20px;font-weight:800;color:${chgLW===null?'var(--text3)':+chgLW>=0?'var(--green)':'var(--red)'}">${chgLW===null?'기록없음':((+chgLW>=0?'+':'')+chgLW+'%')}</div>
        </div>
      </div>
    </div>
  </div>`;
  ct.innerHTML=h;
}

function renderStuMonthly(ct,mc) {
  let h=`<div class="cal-wrap">
    <div class="cal-nav">
      <div class="cal-nav-title">${mc.label} 기록</div>
      <div class="cal-nav-btns">${MONTHS.slice(0,6).map(m=>`<button class="mnbtn ${m.key===curStuMk?'on':''}" onclick="curStuMk='${m.key}';renderStudent()">${m.label}</button>`).join('')}</div>
    </div>
    <div class="cal-grid">
      ${DK.map((d,i)=>`<div class="cal-hd ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('')}`;

  const firstDow=new Date(mc.y,mc.m-1,1).getDay();
  for(let i=0;i<firstDow;i++) h+=`<div></div>`;
  for(let d=1;d<=mc.days;d++){
    const dt=new Date(mc.y,mc.m-1,d);
    const dow=dt.getDay();
    const dk="d"+String(d).padStart(2,"0");
    const sd=((((DB[mc.key]||{})[dk]||{}).students)||{})[curStudent]||{};
    const isToday=mc.m===TODAY.m&&mc.y===TODAY.y&&d===TODAY.d;
    const isFuture=mc.y>TODAY.y||(mc.y===TODAY.y&&(mc.m>TODAY.m||(mc.m===TODAY.m&&d>TODAY.d)));
    const h2=parseFloat(sd.hours||sd.studyHours||0)||0;
    h+=`<div class="cal-day ${isToday?'td':''} ${isFuture?'future':''} ${dow===0?'sun':dow===6?'sat':''}">
      <div class="dn">${d}</div>
      ${h2>0?`<div class="dh">${h2}h</div>`:''}
      ${sd.done?`<div class="caldot caldot-done"></div>`:isFuture?'':`<div class="caldot caldot-none"></div>`}
    </div>`;
  }
  h+=`</div></div>`;
  ct.innerHTML=h;
}

function renderStuCompare(ct) {
  if(!isCompareOn()){
    ct.innerHTML=`<div class="empty"><div class="ei">🔒</div>선생님이 비교를 비공개로 설정했습니다</div>`;
    return;
  }
  const rank=getTodayRank();
  const maxH=Math.max(...rank.map(s=>s.hours),0.1);
  let h=`<div class="rchart">
    <div class="rchart-title">🏆 오늘 공부량 비교</div>
    ${rank.map((s,i)=>{
      const isMe=s.name===curStudent;
      return `<div class="rbar-row" style="${isMe?'background:rgba(59,130,246,.07);border-radius:6px;padding:2px 0':''}">
        <div class="rbar-name" style="${isMe?'color:var(--blue);font-weight:700':''}">${s.name}</div>
        <div class="rbar-track">
          <div class="rbar-fill ${isMe?'rbar-me':'rbar-other'}" style="width:${Math.max(s.hours/maxH*100,1)}%">${s.hours>0?s.hours.toFixed(1)+'h':''}</div>
        </div>
        <div class="rrank">${i+1}</div>
      </div>`;
    }).join('')}
    <div style="font-size:10px;color:var(--text3);text-align:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
      페이지: ${rank.map(s=>`${s.name} ${s.pages}P`).join(' · ')}
    </div>
  </div>`;
  ct.innerHTML=h;
}

function renderStuMemo(ct) {
  const memos=ep('memos',curStudent);
  const feedbacks=Object.entries(ep('feedback',curStudent)).sort((a,b)=>b[0].localeCompare(a[0]));
  const tk=`${TODAY.y}_${String(TODAY.m).padStart(2,"0")}_${String(TODAY.d).padStart(2,"0")}`;
  const memo=(memos[tk]||{}).text||'';

  let h=`<div class="card">
    <div class="card-title">📝 오늘의 메모</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:8px">어려운 점, 막힌 문제, 느낀 점 자유롭게</div>
    <textarea class="memo-ta" id="memoTa" placeholder="오늘 공부한 것, 막힌 부분...">${memo}</textarea>
    <div style="display:flex;justify-content:flex-end;margin-top:8px">
      <button class="btn btn-blue" id="saveMemoBtn" onclick="saveMemo('${tk}')">저장</button>
    </div>
  </div>`;

  h+=`<div class="fb-wrap">
    <div class="fb-title">💬 선생님 피드백</div>
    ${feedbacks.length?feedbacks.slice(0,10).map(([k,v])=>`
      <div class="fb-item">${v.text||v}<div class="fb-meta">${k.replace(/_/g,'-')}</div></div>`).join('')
    :`<div style="font-size:12px;color:var(--text3);text-align:center;padding:14px">피드백이 없습니다</div>`}
  </div>`;
  ct.innerHTML=h;
}

function saveMemo(tk) {
  const val=document.getElementById('memoTa').value;
  ep('memos',curStudent)[tk]={text:val,time:new Date().toISOString()};
  save();
  const btn=document.getElementById('saveMemoBtn');
  if(btn){btn.textContent='저장됨 ✓';btn.style.background='var(--green)';setTimeout(()=>{btn.textContent='저장';btn.style.background='';},1500);}
}

// ── FAB 스크롤 ──
window.addEventListener('scroll',()=>{
  const f=document.getElementById('fabAdmin');
  if(f) f.classList.toggle('on',scrollY>300);
});

// ═══════════════════════════════════════════
load();
buildHomeGrid();
</script>
